services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmshop}
      POSTGRES_DB: ${POSTGRES_DB:-rmshop}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmshop} -d ${POSTGRES_DB:-rmshop}"]
      interval: 3s
      timeout: 5s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # Значения из .env. Символ $ в ключах кассы экранируйте как $$
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./legal:/app/legal
      - ./webapp:/app/webapp
      - ./admin:/app/admin
      - ./backups:/app/backups
      - ./data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rmshop}:${POSTGRES_PASSWORD:-rmshop}@postgres:5432/${POSTGRES_DB:-rmshop}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  pgdata:
