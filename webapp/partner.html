<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Статистика рекламы</title>
<style>
  :root {
    --bg: #101114; --card: rgba(30,34,44,.62); --edge: rgba(255,255,255,.12);
    --text: #f0f1f4; --muted: #9aa1b2; --accent: #a8c7ff; --danger: #ff9b9b;
  }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    font: 15px/1.45 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(60vw 60vw at 0% 0%, rgba(118,140,214,.22), transparent 70%),
                radial-gradient(50vw 50vw at 100% 40%, rgba(156,128,214,.14), transparent 70%); }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 64px; }
  .brand { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  h1 { margin-top: 6px; font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; overflow-wrap: anywhere; }
  h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .muted { color: var(--muted); }
  .card { background: linear-gradient(145deg, rgba(255,255,255,.06), transparent 50%), var(--card);
    border: 1px solid var(--edge); border-radius: 22px; padding: 18px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 22px; }
  .stat b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12.5px; color: var(--muted); }
  .create { margin-top: 14px; }
  .create p { margin-top: 4px; font-size: 13.5px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  input { flex: 1; min-width: 0; height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--edge);
    background: rgba(0,0,0,.25); color: var(--text); font: inherit; outline: none; }
  input:focus { border-color: var(--accent); }
  button { font: inherit; cursor: pointer; border: 0; }
  .primary { height: 46px; padding: 0 18px; border-radius: 14px; background: var(--text); color: var(--bg); font-weight: 700; white-space: nowrap; }
  .primary:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid var(--edge);
    color: var(--text); font-size: 13px; font-weight: 500; }
  .chip:hover { background: rgba(255,255,255,.12); }
  .error { margin-top: 10px; color: var(--danger); font-size: 13.5px; }
  .list-head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 2px 10px; }
  .links { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .card { min-width: 0; }
  .link-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .link-title { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
  .link-date { font-size: 12.5px; color: var(--muted); white-space: nowrap; margin-top: 2px; }
  .url { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 6px 6px 12px; border-radius: 12px; background: rgba(0,0,0,.25); }
  .url code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); }
  .copy { padding: 7px 12px; border-radius: 9px; background: rgba(255,255,255,.1); color: var(--text); font-size: 13px; font-weight: 600; }
  .mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .mini div { font-size: 12px; color: var(--muted); }
  .mini b { display: block; font-size: 18px; color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; padding: 34px 18px; }
  .note { margin-top: 22px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .center { min-height: 70vh; display: grid; place-items: center; text-align: center; }
  @media (max-width: 560px) {
    h1 { font-size: 24px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row { flex-direction: column; }
    .primary { width: 100%; }
  }
</style>
</head>
<body>
<main id="app"><div class="center muted">Загружаем…</div></main>
<template id="tpl">
  <div class="brand" data-brand></div>
  <h1 data-title></h1>
  <div class="stats">
    <div class="card stat"><b data-total="clicks">0</b><span>Переходов</span></div>
    <div class="card stat"><b data-total="users">0</b><span>Пришли в бот</span></div>
    <div class="card stat"><b data-total="connected">0</b><span>Подключили VPN</span></div>
    <div class="card stat"><b data-total="paid">0</b><span>Оплатили</span></div>
  </div>
  <form class="card create" data-form>
    <h2>Новая рекламная ссылка</h2>
    <p class="muted">Назовите её по месту размещения, чтобы потом понять, что сработало.</p>
    <div class="chips" data-chips></div>
    <div class="row">
      <input data-input maxlength="80" placeholder="Например, TikTok — ролик про скорость" aria-label="Название ссылки">
      <button class="primary" data-submit type="submit">Создать ссылку</button>
    </div>
    <div class="error" data-error hidden></div>
  </form>
  <div class="list-head"><h2>Ваши ссылки</h2><span class="muted" data-count></span></div>
  <div class="links" data-links></div>
  <p class="note">Статистика обновляется сама раз в минуту. Удалить ссылку нельзя — так цифры остаются честными.</p>
</template>
<script>
(() => {
  const token = location.pathname.split("/")[2] || "";
  const endpoint = `/partner/${encodeURIComponent(token)}/api`;
  const app = document.getElementById("app");
  const PRESETS = ["TikTok", "Instagram", "YouTube", "Telegram", "VK", "Reels", "Shorts"];
  const num = (n) => Number(n || 0).toLocaleString("ru-RU");
  let ui = null;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  async function copy(text, button) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const area = el("textarea"); area.value = text; document.body.append(area);
      area.select(); document.execCommand("copy"); area.remove();
    }
    const was = button.textContent;
    button.textContent = "Скопировано";
    setTimeout(() => { button.textContent = was; }, 1400);
  }

  function linkCard(item) {
    const card = el("article", "card");
    const top = el("div", "link-top");
    top.append(el("div", "link-title", item.title));
    if (item.created_at) {
      top.append(el("div", "link-date", new Date(item.created_at).toLocaleDateString("ru-RU", { day: "numeric", month: "short" })));
    }
    const url = el("div", "url");
    const button = el("button", "copy", "Копировать");
    button.type = "button";
    button.addEventListener("click", () => copy(item.url, button));
    url.append(el("code", null, item.url), button);
    const mini = el("div", "mini");
    [["clicks", "Переходы"], ["users", "Пришли"], ["connected", "Подключили"], ["paid", "Оплатили"]].forEach(([key, label]) => {
      const cell = el("div"); cell.append(el("b", null, num(item[key])), label); mini.append(cell);
    });
    card.append(top, url, mini);
    return card;
  }

  function render(data) {
    if (!ui) {
      app.replaceChildren(document.getElementById("tpl").content.cloneNode(true));
      ui = Object.fromEntries([...app.querySelectorAll("[data-brand],[data-title],[data-form],[data-input],[data-submit],[data-error],[data-count],[data-links],[data-chips]")]
        .map((node) => [Object.keys(node.dataset)[0], node]));
      PRESETS.forEach((name) => {
        const chip = el("button", "chip", name);
        chip.type = "button";
        chip.addEventListener("click", () => { ui.input.value = name + " — "; ui.input.focus(); });
        ui.chips.append(chip);
      });
      ui.form.addEventListener("submit", create);
    }
    document.title = `${data.title} · статистика`;
    ui.brand.textContent = data.brand || "";
    ui.title.textContent = data.title;
    const items = data.items || [];
    ["clicks", "users", "connected", "paid"].forEach((key) => {
      app.querySelector(`[data-total="${key}"]`).textContent = num(items.reduce((sum, item) => sum + Number(item[key] || 0), 0));
    });
    ui.count.textContent = items.length ? `${items.length}` : "";
    if (!items.length) {
      const empty = el("div", "card empty muted", "Ссылок пока нет. Создайте первую выше — она сразу появится здесь.");
      ui.links.replaceChildren(empty);
    } else {
      ui.links.replaceChildren(...items.map(linkCard));
    }
  }

  async function request(options) {
    const response = await fetch(endpoint, { cache: "no-store", ...options });
    const data = await response.json().catch(() => ({}));
    if (response.status === 404) throw Object.assign(new Error("gone"), { gone: true });
    if (!response.ok || !data.ok) throw new Error(data.error || "Не получилось, попробуйте ещё раз");
    return data;
  }

  function showGone() {
    app.replaceChildren(el("div", "center", "Ссылка недействительна. Попросите новую у менеджера."));
  }

  async function load() {
    try { render(await request()); }
    catch (error) {
      if (error.gone) showGone();
      else if (!ui) app.replaceChildren(el("div", "center muted", "Не удалось загрузить. Обновите страницу."));
    }
  }

  async function create(event) {
    event.preventDefault();
    const title = ui.input.value.trim().replace(/\s*—\s*$/, "");
    ui.error.hidden = true;
    if (title.length < 2) { ui.error.textContent = "Напишите название — хотя бы пару букв"; ui.error.hidden = false; return; }
    ui.submit.disabled = true;
    try {
      render(await request({ method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }) }));
      ui.input.value = "";
      const first = ui.links.querySelector(".copy");
      if (first) first.closest(".card").scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (error) {
      if (error.gone) return showGone();
      ui.error.textContent = error.message; ui.error.hidden = false;
    } finally {
      ui.submit.disabled = false;
    }
  }

  load();
  setInterval(() => { if (!document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>
