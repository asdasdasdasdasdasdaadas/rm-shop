<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Открыть приложение</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0d1611;
      color: #f1f6f2;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { padding: 32px 20px; max-width: 420px; margin: 0 auto; }
    p { line-height: 1.45; color: #9db3a4; }
    a {
      display: inline-block;
      margin-top: 12px;
      color: #0d1611;
      background: #5fd68b;
      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 16px;
    }
    a.hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <p id="msg">Открываем приложение…</p>
    <a id="manual" class="hidden" href="#">Открыть вручную</a>
  </main>
  <script>
    (function () {
      var scheme = (to.split(":")[0] || "").toLowerCase();
      var blocked = { javascript:1, data:1, file:1, about:1, blob:1, mailto:1, http:1, https:1, vbscript:1 };
      if (!/^[a-z][a-z0-9+.-]{0,31}$/.test(scheme) || blocked[scheme] || to.indexOf("://") < 0) {
        msg.textContent = "Не удалось открыть приложение.";
        return;
      }
      a.href = to;
      a.classList.remove("hidden");
      location.href = to;
      setTimeout(function () {
        msg.textContent = "Если приложение не открылось, нажмите кнопку ниже. Убедитесь, что клиент установлен.";
      }, 700);
    })();
  </script>
</body>
</html>
