<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Путь нового клиента</title>
<link rel="stylesheet" href="../../webapp/cab.css">
<style>
body{background:#0a0b0d;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px;display:grid;grid-template-columns:360px 1fr;gap:44px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:24px}.left{position:static!important}.phone{max-width:360px;margin:0 auto}}
.left{position:sticky;top:18px}
.top h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.3px}
.top p{margin:8px 0 0;color:#9aa0ab;font-size:15px;line-height:1.5}
.bar{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.bar button{height:38px;padding:0 15px;border-radius:99px;background:#1c1e23;font-size:14px;font-weight:600;color:#dfe3ea}
.bar button.on{background:#fff;color:#111}
.prog{display:flex;gap:3px;margin:12px 0 0}.prog i{flex:1;height:4px;border-radius:9px;background:#24272e;position:relative;overflow:hidden}
.prog i.done{background:#3e88f7}.prog i.on::after{content:"";position:absolute;inset:0;background:#3e88f7;transform-origin:left;animation:pg var(--d,10s) linear forwards}
@keyframes pg{from{transform:scaleX(0)}}
.cap{margin:12px 2px 0;min-height:44px;font-size:14.5px;color:#dfe3ea;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.cap .dy{flex-shrink:0;white-space:nowrap;font-size:12px;font-weight:700;color:#0a0b0d;background:#ffd25e;border-radius:99px;padding:3px 9px;margin-top:1px}
.cap span.t{animation:fin .35s ease both}
.chap{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.chap li{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:14px 16px;border-radius:18px;background:#121418;cursor:pointer;transition:background .35s,opacity .35s,transform .35s;opacity:.6}
.chap li:hover{opacity:.9}
.chap li .i{width:34px;height:34px;border-radius:99px;background:#22252c;display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .3s}
.chap li .w{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#7f8794}
.chap li b{font-size:16px;display:block;margin-top:1px}
.chap li .d{font-size:13.5px;color:#9aa0ab;line-height:1.45;margin-top:4px;display:none}
.chap li .pt{display:none;gap:5px;flex-wrap:wrap;margin-top:8px}
.chap li .pt em{font-style:normal;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:rgba(94,168,255,.12);color:#8cc0ff}
.chap li.done{opacity:.8}.chap li.done .i{background:#1d3a2a}
.chap li.on{opacity:1;background:#18212e;transform:translateX(4px)}.chap li.on .i{background:#3e88f7}
.chap li.on .d{display:block}.chap li.on .pt{display:flex}
/* phone */
.phone{width:100%;height:740px;border-radius:50px;border:10px solid #000;box-shadow:0 0 0 1.5px #2a2c33,0 30px 70px rgba(0,0,0,.55);position:relative;overflow:hidden;background:#000;isolation:isolate}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:99px;background:#000;z-index:90;transition:width .5s var(--ease),height .5s var(--ease)}
.sbar{position:absolute;left:0;right:0;top:0;height:46px;z-index:80;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0 30px;font-size:15px;font-weight:600;color:#fff;pointer-events:none}
.phone.light .sbar{filter:invert(1)}
.sbar .r{display:flex;gap:6px;align-items:center}
.sbar .vpn{font-size:11px;font-weight:700;border:1.5px solid #fff;border-radius:4px;padding:0 3px;line-height:14px;display:none}
.sbar .vpn.on{display:inline-block;animation:pop .5s var(--ease) both}
.bat{width:24px;height:12px;border:1.5px solid rgba(255,255,255,.6);border-radius:4px;position:relative}.bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:#fff;border-radius:1.5px}
.scene{position:absolute;inset:0;background:var(--bg)}
.layer{position:absolute;inset:0;overflow:hidden}
.homeind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:9px;background:rgba(255,255,255,.8);z-index:85}
.stage{position:absolute;inset:0}
.phone .scr{position:absolute;inset:0;min-height:0;overflow:hidden;padding:12px 0 30px;z-index:1}
.phone .scr.ghost{position:absolute;max-width:none;z-index:0}
.phone .scr.ghost.leaveB{z-index:2}
.frog{width:78px;height:78px}
.pressed{transform:scale(.95)!important;transition:transform .12s}
.finger{position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.9);z-index:95;opacity:0;pointer-events:none;transition:transform .6s cubic-bezier(.3,.8,.3,1),opacity .3s;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.finger.on{opacity:1}.finger.press{background:rgba(255,255,255,.6)}
.finger::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid #fff;opacity:0}
.finger.press::after{animation:ring .45s ease-out}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.1)}}
.rise{animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.97)}}
@keyframes fadein{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes sheet{from{transform:translateY(100%)}}@keyframes sheetout{to{transform:translateY(100%)}}
.chk{animation:pop .6s var(--ease) both}
.conf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;z-index:75;animation:fall 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(780px) rotate(540deg);opacity:.2}}
.spin{width:64px;height:64px;border-radius:50%;border:5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite}
.spin.mini{width:20px;height:20px;border-width:2.5px}
@keyframes sp{to{transform:rotate(360deg)}}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}.dots i{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.35);transition:width .3s}.dots i.on{background:#fff;width:18px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:rgba(0,0,0,.22);border-radius:10px;padding:6px 10px;margin:12px auto 0;display:inline-block}
.apb{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:7px 14px 7px 11px;border-radius:99px;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);font-size:13.5px;font-weight:600;white-space:nowrap;animation:pop .6s .5s var(--ease) both}
.big-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;background:var(--blue);color:#fff;font-size:16.5px;font-weight:600;width:100%;transition:transform .15s,background .3s}
.big-btn.ok{background:var(--grn)}
.later{display:block;text-align:center;color:#c4c9d3;font-size:15px;font-weight:600;margin-top:4px;width:100%;height:44px}
.rnd2{width:52px;height:52px;border-radius:99px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;transition:transform .15s}
.acts2{display:flex;gap:10px;margin-top:18px}.acts2 .pill{flex:1}
.wait-key{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
/* telegram */
.chat{position:absolute;inset:0;background:#0e1621}
.chat::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(60,120,90,.12),transparent 50%),radial-gradient(circle at 80% 70%,rgba(60,90,140,.14),transparent 50%)}
.tgbar{position:absolute;left:0;right:0;top:46px;display:flex;align-items:center;gap:10px;padding:6px 14px 10px;border-bottom:1px solid rgba(255,255,255,.06);background:#17212b;z-index:3}
.tgbar .bk{color:#5ea8ff;font-size:22px;margin-right:2px}
.tgbar .av{width:38px;height:38px;border-radius:50%;overflow:hidden}.tgbar .av img{width:38px;height:38px}
.tgbar b{font-size:15.5px;display:block}.tgbar span{font-size:13px;color:#7d8b99}
.feed{position:absolute;left:0;right:0;top:104px;bottom:58px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.feed > div{flex-shrink:0}
.inp{position:absolute;left:0;right:0;bottom:0;height:58px;background:#17212b;display:flex;align-items:center;gap:10px;padding:0 12px 10px;z-index:3}
.inp .bx{flex:1;height:36px;border-radius:99px;background:#0e1621;color:#6d7f8f;font-size:15px;display:flex;align-items:center;padding:0 14px}
.inp .mn{height:36px;padding:0 12px;border-radius:99px;background:#3e88f7;font-size:14px;font-weight:600;display:flex;align-items:center}
.day{text-align:center;margin:4px 0 10px}.day span{background:rgba(0,0,0,.35);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:99px}
.msg{animation:min .4s var(--ease) both;transform-origin:left bottom}
.msg.me{display:flex;justify-content:flex-end}
@keyframes min{from{opacity:0;transform:translateY(16px) scale(.96)}}
.bub{background:#182533;border-radius:16px 16px 16px 5px;padding:9px 12px 7px;font-size:14.5px;line-height:1.38;max-width:92%;color:#fff;transition:opacity .25s;margin-bottom:6px}
.bub.mine{background:#2b5278;border-radius:16px 16px 5px 16px}
.bub .t{float:right;font-size:11.5px;color:#6d7f8f;margin:6px 0 0 10px}.bub b{font-weight:600}
.bub .q{border-left:3px solid #5ea8ff;padding:2px 0 2px 9px;margin-top:6px;color:#c9d4de}
.bub .q.g{border-color:#3ccf74}
.bub small{display:block;color:#8a9aab;font-size:12.5px;margin-top:6px}
.kb{display:grid;gap:4px;margin:-2px 0 12px;max-width:92%}.kb.two{grid-template-columns:1fr 1fr}
.kb div{background:rgba(70,95,120,.35);border-radius:10px;padding:9px;text-align:center;font-size:14px;font-weight:600;color:#fff;transition:transform .12s}
.kb div.g{background:#2f9e5c}
.stk{width:120px;height:120px;margin:0 0 8px;animation:stk 1.2s var(--ease) both}
@keyframes stk{0%{opacity:0;transform:scale(.3) rotate(-20deg)}50%{transform:scale(1.12) rotate(8deg)}70%{transform:scale(.95) rotate(-3deg)}100%{transform:none}}
.typing{display:inline-flex;gap:4px;background:#182533;border-radius:16px;padding:12px 14px;margin-bottom:8px}
.typing span{width:7px;height:7px;border-radius:50%;background:#7d8b99;animation:tp 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{30%{transform:translateY(-4px);opacity:1}0%,60%,100%{opacity:.4}}
.webapp{position:absolute;left:0;right:0;bottom:0;top:46px;border-radius:14px 14px 0 0;background:var(--bg);z-index:20;animation:sheet .5s var(--ease) both;overflow:hidden;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.webapp.out{animation:sheetout .4s both}
.webapp .wh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;font-weight:600;font-size:15px}
.webapp .wh span:first-child,.webapp .wh span:last-child{color:#5ea8ff;font-weight:500}
.webapp .stage{top:44px}
/* banner (push) */
.push{position:absolute;left:10px;right:10px;top:50px;z-index:88;background:rgba(40,42,48,.92);backdrop-filter:blur(20px);border-radius:20px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;animation:pdown .5s var(--ease) both;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.push img{width:38px;height:38px;border-radius:10px}.push b{font-size:14.5px;display:flex;justify-content:space-between}.push b small{font-weight:400;color:#9aa0ab;font-size:12.5px}
.push div{font-size:14px;line-height:1.35;color:#e8eaee;flex:1}
.push.out{animation:pup .35s both}
@keyframes pdown{from{transform:translateY(-130%)}}@keyframes pup{to{transform:translateY(-130%);opacity:0}}
/* lock screen */
.lock{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,#2a3f6b 0%,#141b2c 55%,#07090e 100%);z-index:30;animation:fadein .5s both}
.lock .clock{text-align:center;margin-top:92px;font-size:76px;font-weight:300;letter-spacing:-2px;line-height:1}
.lock .date{text-align:center;font-size:17px;font-weight:500;margin-top:62px;margin-top:-2px;opacity:.85}
.lock .dt0{text-align:center;font-size:17px;font-weight:500;margin-top:96px;opacity:.85}
.lock .push{position:absolute;top:auto;bottom:120px;animation:rise .55s var(--ease) both}
/* app switch */
.happ{position:absolute;inset:0;background:linear-gradient(180deg,#101522,#0a0d14);z-index:40;padding-top:56px;text-align:center}
.zin{animation:zin .45s var(--ease) both}@keyframes zin{from{transform:scale(.6);opacity:0;border-radius:40px}}
.zout{animation:zout .4s var(--ease) both}@keyframes zout{to{transform:scale(.6);opacity:0;border-radius:40px}}
.happ .hh{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px}.happ .hh img{width:28px;height:28px;border-radius:8px}
.happ .prof{margin:18px 16px 0;background:#182032;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left}
.happ .prof .fl{font-size:26px}.happ .prof b{display:block;font-size:15px}.happ .prof span{font-size:12.5px;color:#8b95a7}
.happ .prof.new{animation:rise .5s var(--ease) both;box-shadow:0 0 0 1.5px #3ccf74}
.power{width:170px;height:170px;border-radius:50%;margin:52px auto 0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#2a3550,#161d2e);box-shadow:0 0 0 10px rgba(255,255,255,.03),0 20px 40px rgba(0,0,0,.5);transition:background .5s,box-shadow .5s;position:relative}
.power svg{width:64px;height:64px;transition:stroke .4s}
.power.ing::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid transparent;border-top-color:#5ea8ff;animation:sp 1s linear infinite}
.power.on{background:radial-gradient(circle at 50% 35%,#3bd37f,#178a4a);box-shadow:0 0 0 10px rgba(60,207,116,.12),0 0 60px rgba(60,207,116,.45)}
.happ .st2{margin-top:22px;font-size:20px;font-weight:700}.happ .st3{margin-top:4px;color:#8b95a7;font-size:14px;font-variant-numeric:tabular-nums}
.ios-alert{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;align-items:center;justify-content:center;animation:fadein .25s both}
.ios-alert .box{width:270px;border-radius:14px;background:rgba(44,44,48,.96);text-align:center;overflow:hidden;animation:pop .35s var(--ease) both}
.ios-alert .tx{padding:18px 16px 14px}.ios-alert b{font-size:16.5px;display:block}.ios-alert p{font-size:13px;margin:6px 0 0;line-height:1.35;color:#e5e5ea}
.ios-alert .bt{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid rgba(255,255,255,.18)}
.ios-alert .bt div{padding:12px;font-size:16.5px;color:#0a84ff;transition:background .15s}.ios-alert .bt div+div{border-left:.5px solid rgba(255,255,255,.18)}
/* pay page */
.paypage{position:absolute;inset:0;z-index:50;background:#f2f3f7;color:#111;padding-top:46px;animation:sheet .45s var(--ease) both}
.paypage.out{animation:sheetout .4s both}
.paypage .url{margin:4px 12px 0;height:34px;border-radius:10px;background:#e3e5ec;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:#444}
.paypage .pbox{margin:16px 14px 0;background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.paypage .sum{font-size:13px;color:#777}.paypage .sum b{display:block;font-size:30px;color:#111;margin-top:2px}
.paypage .fld{margin-top:12px;height:48px;border-radius:12px;border:1.5px solid #e1e3ea;display:flex;align-items:center;padding:0 14px;font-size:16px;letter-spacing:.5px;color:#111;font-variant-numeric:tabular-nums}
.paypage .fld.on{border-color:#3e88f7}
.paypage .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paypage .pb{margin-top:16px;height:52px;border-radius:14px;background:#111;color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;width:100%;transition:transform .15s}
.paypage .sec{text-align:center;font-size:12px;color:#888;margin-top:12px}
.caret::after{content:"|";animation:blink 1s steps(1) infinite;color:#3e88f7;margin-left:1px}@keyframes blink{50%{opacity:0}}
/* sheet */
.sheetwrap{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;animation:fadein .35s both}
.sheetwrap.out{animation:fadeout .3s both}.sheetwrap.out .sheet{animation:sheetout .35s both}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px 22px;animation:sheet .55s var(--ease) both}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:#3a3d45;margin:0 auto 12px}
.sheet .hd{display:flex;gap:12px;align-items:center}
.sheet .hd .ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,#5fd38d,#16804a);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.sheet h3{margin:0;font-size:19px;line-height:1.2}.sheet .hd span{font-size:13.5px;color:var(--hint)}
.sheet .lbl{font-size:13px;color:var(--hint);margin:16px 0 8px;font-weight:600}
.sheet .chp{justify-content:flex-start;margin:0}.sheet .chp button{background:#2a2d34;height:36px;padding:0 14px}.sheet .chp .on{background:#fff;color:#111}
.mtl{margin-top:14px;background:#121317;border-radius:16px;padding:4px 14px}
.mtl .r{display:flex;gap:12px;align-items:center;padding:9px 0;font-size:14px;animation:rise .45s var(--ease) both}
.mtl .r:nth-child(2){animation-delay:.15s}.mtl .r:nth-child(3){animation-delay:.3s}
.mtl .r + .r{border-top:1px solid var(--sep)}
.mtl .r i{font-style:normal;width:28px;text-align:center;font-size:17px}.mtl .r small{display:block;color:var(--hint);font-size:12.5px;margin-top:1px}
.fine{font-size:12px;color:var(--hint);text-align:center;margin-top:8px;line-height:1.4}.fine u{color:#8cc0ff;text-decoration:none}
.sheet .big-btn{margin-top:14px}
.toast2{position:absolute;left:12px;right:12px;bottom:28px;z-index:40;background:#2a2d34;border-radius:16px;padding:12px 14px;font-size:14.5px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:tin .45s var(--ease) both}
.toast2.out{animation:tout .35s both}
@keyframes tin{from{opacity:0;transform:translateY(30px)}}@keyframes tout{to{opacity:0;transform:translateY(30px)}}
.endc{position:absolute;inset:0;z-index:70;background:radial-gradient(100% 70% at 50% 20%,#1f4d35,#0d1410 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;animation:fadein .6s both}
.endc h2{margin:16px 0 6px;font-size:24px}.endc p{color:#b9c6bd;font-size:14.5px;line-height:1.5;margin:0}
.endc .st4{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:22px;width:100%}
.endc .st4 div{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 6px;font-size:12px;color:#b9c6bd;animation:rise .5s var(--ease) both}
.endc .st4 div:nth-child(2){animation-delay:.12s}.endc .st4 div:nth-child(3){animation-delay:.24s}
.endc .st4 b{display:block;font-size:18px;color:#fff}
.app-ic{width:92px;height:92px;border-radius:22px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.ok-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;font-weight:600;font-size:14px;background:rgba(255,255,255,.18);border-radius:99px;padding:6px 12px;width:max-content;margin-left:auto;margin-right:auto;animation:pop .5s var(--ease) both}
.thanks{animation:rise .5s var(--ease) both}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="phone" id="ph">
      <div class="island"></div>
      <div class="sbar"><span id="clk">10:00</span><span class="r"><span class="vpn" id="vpn">VPN</span>
        <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#fff"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#fff"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#fff"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#fff"/></svg><span class="bat"></span></span></div>
      <div class="scene" id="scene"></div>
      <div class="homeind"></div>
      <div class="finger" id="fg"></div>

// ---------- player ----------
const chapEl = $("#chap"), prog = $("#prog");
CH.forEach((c, i) => {
  chapEl.insertAdjacentHTML("beforeend", `<li data-i="${i}"><span class="i">${c.e}</span><div><span class="w">${c.w}</span><b>${c.t}</b><div class="d">${c.d}</div><div class="pt">${c.p.map((p) => `<em>${p}</em>`).join("")}</div></div></li>`);
  prog.insertAdjacentHTML("beforeend", "<i></i>");
});
chapEl.onclick = (e) => { const li = e.target.closest("li"); if (li) play(+li.dataset.i); };
const LEN = [14, 9, 14, 11, 8, 12, 17, 11, 12];
function mark(i) {
  [...chapEl.children].forEach((l, k) => { l.classList.toggle("on", k === i); l.classList.toggle("done", k < i); });
  [...prog.children].forEach((b, k) => { b.className = k < i ? "done" : k === i ? "on" : ""; b.style.setProperty("--d", LEN[k] * SPEED + "s"); });
}
async function play(from = 0) {
  const my = ++token; paused = false; $("#play").textContent = "⏸ Пауза";
  clear(); vpn(from >= 4);
  try {
    for (let i = from; i < CHAPTERS.length; i++) {
      cur = i; mark(i);
      if (window.innerWidth > 900) [...chapEl.children][i].scrollIntoView({ block: "nearest", behavior: "smooth" });
      await CHAPTERS[i]();
      await w(500);
    }
    await w(1500);
    if (my === token) play(0);
  } catch (e) { if (e !== "stop") console.error(e); }
}
$("#play").onclick = () => {
  paused = !paused; $("#play").textContent = paused ? "▶ Дальше" : "⏸ Пауза";
  document.getAnimations().forEach((a) => (paused ? a.pause() : a.play()));
};
$("#prev").onclick = () => play(Math.max(0, cur - 1));
$("#next").onclick = () => play(Math.min(CHAPTERS.length - 1, cur + 1));
$("#restart").onclick = () => play(0);
$("#slow").onclick = (e) => { SPEED = SPEED === 1 ? 1.7 : 1; e.target.classList.toggle("on", SPEED !== 1); play(cur); };
play(0);
</script>
