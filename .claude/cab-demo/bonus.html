<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бонус: варианты</title><link rel="stylesheet" href="/cab.css">
<style>
body { background: #08090b; padding: 20px 12px 50px; }
h1 { color: #fff; font-size: 22px; margin: 6px 8px 4px; } p.s { color: #9aa0ab; margin: 0 8px 16px; font-size: 14px; }
.wall { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 34px; } .wall > div { width: 375px; }
.lab { color: #fff; font-weight: 700; font-size: 17px; margin: 0 6px 2px; } .sub { color: #9aa0ab; font-size: 13.5px; margin: 0 6px 10px; min-height: 36px; }
.ph { background: var(--bg); border-radius: 30px; padding: 14px 0 18px; box-shadow: 0 0 0 1px rgba(255,255,255,.07); overflow: hidden; }
.ph * { animation-play-state: running; }
.ph .hc, .ph .cd, .ph .st { animation: none; }
/* keypad top */
.kp { --acc: #2fbf71; position: relative; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.kp .am-glow { top: 10px; left: 50%; margin-left: -140px; }
.kp .row { display: flex; align-items: center; }
.kp .num { font-weight: 800; font-size: 62px; letter-spacing: -2px; line-height: 1; color: #fff; }
.kp .cur { width: 3px; height: 46px; margin: 0 5px; border-radius: 2px; background: var(--acc); }
.kp .rub { color: var(--acc); font-weight: 800; font-size: 30px; }
.kp .ico { margin-right: 8px; }
.kp .am-sub { margin-top: 12px; }
.gold { color: #ffd76a; }
/* K1 */
.k1 { margin-top: 14px; text-align: center; }
.k1 .big { font-size: 34px; font-weight: 800; letter-spacing: -.5px; background: linear-gradient(90deg, #fff3c4, #ffd76a 40%, #fff3c4 60%, #f7b733); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: fbtext 3s linear infinite; }
.k1 .sm { font-size: 13px; color: #b9ad86; font-weight: 600; margin-top: 2px; letter-spacing: .02em; }
/* K2 */
.k2 { display: inline-flex; align-items: center; margin-top: 12px; border-radius: 99px; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 600; overflow: hidden; }
.k2 .a { padding: 6px 12px; color: rgba(255,255,255,.75); }
.k2 .b { padding: 6px 12px; background: linear-gradient(180deg, #ffe08a, #f7b733); color: #4a2f00; font-weight: 800; position: relative; }
.k2 .b::after, .k4b::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.6), transparent 70%); background-size: 250% 100%; animation: amfbsh 2.6s ease-in-out infinite; }
/* K3 */
.k3 { margin-top: 16px; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 18px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,215,106,.18); }
.k3 .c { text-align: center; } .k3 .c b { display: block; font-size: 19px; color: #fff; } .k3 .c span { font-size: 11.5px; color: var(--hint); font-weight: 600; }
.k3 .c.g b { color: #ffd76a; } .k3 .op { color: var(--hint); font-size: 18px; font-weight: 700; } .k3 .c.t b { font-size: 21px; }
/* K4 */
.k4 { position: relative; }
.k4b { position: absolute; right: -40px; top: -22px; transform: rotate(10deg); background: linear-gradient(180deg, #ffe08a, #f7b733); color: #4a2f00; font-weight: 900; font-size: 15px; padding: 5px 10px; border-radius: 12px; box-shadow: 0 8px 20px rgba(247,183,51,.35); overflow: hidden; animation: k4f 2.6s ease-in-out infinite; }
@keyframes k4f { 50% { transform: rotate(4deg) translateY(-4px); } }
.k4l { margin-top: 12px; font-size: 15px; color: rgba(255,255,255,.8); font-weight: 600; } .k4l b { color: #ffd76a; }
/* home */
.hm .hc { margin: 0 8px; }
.h1s { margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 12px; border-radius: 16px; background: rgba(0,0,0,.18); font-size: 14.5px; font-weight: 600; }
.h1s .t { font-variant-numeric: tabular-nums; background: linear-gradient(180deg, #ffe08a, #f7b733); color: #4a2f00; font-weight: 800; padding: 2px 8px; border-radius: 99px; font-size: 13.5px; }
.h2 { margin: 12px 12px 0; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 22px; background: var(--card); box-shadow: inset 0 0 0 1px rgba(255,215,106,.22); }
.h2 .gi { width: 56px; height: 56px; position: relative; flex-shrink: 0; } .h2 .gi > div { position: absolute; left: -22px; top: -6px; width: 100px; height: 68px; }
.h2 .tx { flex: 1; min-width: 0; } .h2 .tx b { display: block; font-size: 16px; } .h2 .tx span { font-size: 13px; color: var(--hint); font-variant-numeric: tabular-nums; }
.h2 .go { padding: 9px 14px; border-radius: 99px; background: linear-gradient(180deg, #fff3c4, #ffd76a 55%, #f7b733); color: #3d2700; font-weight: 800; font-size: 14px; }
.h3 { margin: 12px 12px 0; position: relative; overflow: hidden; border-radius: 26px; padding: 18px 18px 18px; background: radial-gradient(90% 90% at 100% 0%, #7b4fd6 0%, rgba(123,79,214,0) 60%), linear-gradient(160deg, #2b1663, #4a2a96 60%, #6d43c4); }
.h3 .gi { position: absolute; right: -50px; top: -10px; width: 250px; height: 126px; }
.h3 .p { font-size: 46px; font-weight: 900; letter-spacing: -1px; line-height: 1; color: #ffd76a; text-shadow: 0 4px 18px rgba(247,183,51,.35); }
.h3 .d { font-size: 14px; color: #d9cff5; margin-top: 4px; max-width: 170px; line-height: 1.35; }
.h3 .cd2 { display: flex; gap: 5px; margin-top: 14px; } .h3 .cd2 span { background: rgba(0,0,0,.22); border-radius: 10px; padding: 5px 8px; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; }
.h3 .cd2 i { font-style: normal; font-size: 11px; opacity: .7; margin-left: 2px; }
.h3 .pill { margin-top: 14px; height: 46px; color: #2b1663; }
</style></head><body>
<h1>«Своя сумма»: где показать бонус</h1><p class="s">Сумма 200 ₽, бонус 35%. Ниже — клавиатура, она не меняется.</p>
<div class="wall" id="kw"></div>
<h1>Главная: карточка бонуса</h1><p class="s">Сверху — обычная зелёная карточка баланса.</p>
<div class="wall" id="hw"></div>
<script src="/icons/lottie-light.min.js?v=5.12.2"></script>
<script>
const CARD = `<svg width="54" height="39" viewBox="0 0 100 72"><rect x="2" y="2" width="96" height="68" rx="12" fill="#fff"/><rect x="2" y="16" width="96" height="12" fill="#2b3a66"/><rect x="12" y="40" width="22" height="16" rx="3" fill="#f2c14e"/><rect x="44" y="46" width="40" height="5" rx="2.5" fill="#c9cfdc"/></svg>`;
const kTop = (extra, numWrap = (x) => x) => `<div class="kp"><div class="am-glow"></div><div class="row"><span class="ico">${CARD}</span>${numWrap('<span class="num">200</span>')}<span class="cur"></span><span class="rub">₽</span></div>${extra}</div>`;
const sub = '<div class="am-sub">≈ 33 дня VPN <span class="sw">⇅</span></div>';
const K = [
  ["1. Бонус второй строкой", "Под суммой крупно и золотом — сколько придёт сверху. Без плашек.", kTop(sub + '<div class="k1"><div class="big">+70 ₽</div><div class="sm">БОНУС 35% К ПЕРВОМУ ПОПОЛНЕНИЮ</div></div>')],
  ["2. В той же строке", "Золотая половинка у строки с днями. Самый спокойный вариант.", kTop('<div class="k2"><span class="a">≈ 33 дня VPN</span><span class="b">🎁 +70 ₽</span></div>')],
  ["3. Итог на баланс", "Сумма + бонус = сколько будет на балансе. Понятно, что выгодно.", kTop(sub + '<div class="k3"><div class="c"><b>200 ₽</b><span>оплата</span></div><div class="op">+</div><div class="c g"><b>70 ₽</b><span>бонус 35%</span></div><div class="op">=</div><div class="c t"><b>270 ₽</b><span>на баланс</span></div></div>')],
  ["4. Наклейка на сумме", "Золотая наклейка «+35%» на числе, ниже — итог на балансе.", kTop('<div class="k4l">На баланс придёт <b>270 ₽</b> · ≈ 45 дней</div>', (n) => `<span class="k4">${n}<span class="k4b">+35%</span></span>`)],
];
const pay = '<div style="padding:0 12px"><div class="am-pay" style="--acc:#2fbf71;display:flex;align-items:center;justify-content:center">Оплатить 200 ₽</div></div>';
document.getElementById("kw").innerHTML = K.map(([t, s, h]) => `<div><div class="lab">${t}</div><div class="sub">${s}</div><div class="ph">${h}${pay}</div></div>`).join("");
const FROG = '<span class="frogw"><img class="frog" src="/icons/frog.png" width="70" height="70" style="width:70px;height:70px" alt=""></span>';
const hero = (x = "", pillx = "") => `<section class="hc green"><div class="ill"><div>${FROG}</div></div><div class="N">10 ₽</div><div class="P">Хватит на 1 день · до 17 ноября</div>${x}<div class="acts"><button class="pill"><span>+ Пополнить</span>${pillx}</button></div></section>`;
const dev = '<div class="st">Устройства</div><div class="cd"><div class="rw"><span class="e">📱</span><span class="tt"><b>Мой iPhone</b><span>Подключено · 6 ₽ в день</span></span></div></div>';
const H = [
  ["1. Внутри карточки баланса", "Отдельной карточки нет: в зелёной — строка с таймером, на кнопке «+35%».",
    hero('<div class="h1s">🎁 +35% к первому пополнению <span class="t" data-cd>1 д 13:59:57</span></div>', '<i class="fbb on" style="background:linear-gradient(180deg,#ffe08a,#f7b733);color:#4a2f00">+35%</i>') + dev],
  ["2. Тонкая строка", "Карточка баланса как сейчас, под ней одна строка с подарком, таймером и кнопкой.",
    hero() + '<div class="h2"><div class="gi"><div data-g></div></div><div class="tx"><b>+35% к пополнению</b><span>ещё <span data-cd>1 д 13:59:57</span></span></div><div class="go">Пополнить</div></div>' + dev],
  ["3. Фиолетовый баннер", "В цвет экрана пополнения: большие «+35%», подарок справа, таймер.",
    hero() + '<div class="h3"><div class="gi" data-g></div><div class="p">+35%</div><div class="d">к первому пополнению от 200 ₽</div><div class="cd2" data-cd2></div><button class="pill"><span>Пополнить 200 ₽ → 270 ₽</span></button></div>' + dev],
];
document.getElementById("hw").innerHTML = H.map(([t, s, h]) => `<div><div class="lab">${t}</div><div class="sub">${s}</div><div class="ph hm">${h}</div></div>`).join("");
let left = 37 * 3600 + 59 * 60 + 57;
const tick = () => { const d = Math.floor(left / 86400), h = Math.floor(left % 86400 / 3600), m = Math.floor(left % 3600 / 60), s = left % 60, p = (n) => String(n).padStart(2, "0");
  document.querySelectorAll("[data-cd]").forEach((e) => (e.textContent = `${d} д ${p(h)}:${p(m)}:${p(s)}`));
  document.querySelectorAll("[data-cd2]").forEach((e) => (e.innerHTML = `<span>${d}<i>д</i></span><span>${p(h)}<i>ч</i></span><span>${p(m)}<i>м</i></span><span>${p(s)}<i>с</i></span>`)); left--; };
tick(); setInterval(tick, 1000);
// the white gift with a gold ribbon, as in the cabinet
const hsl = (r, g, b) => { const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn; if (!d) return [0, 0, l]; const s = d / (1 - Math.abs(2 * l - 1)); let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return [(h * 60 + 360) % 360, s, l]; };
const rgb = (h, s, l) => { const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2; const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x]; return [r + m, g + m, b + m]; };
const tint = (c) => { const [h, s, l] = hsl(c[0], c[1], c[2]); if (s < 0.12) return c; if (h >= 190 && h <= 300) return rgb(45, 0.08, Math.min(0.97, 0.86 + l * 0.14)); if (h >= 5 && h <= 45) return rgb(42, Math.min(1, s + 0.1), Math.min(0.9, l)); return c; };
function walk(o) { if (Array.isArray(o)) return o.forEach(walk); if (!o || typeof o !== "object") return;
  if ((o.ty === "fl" || o.ty === "st") && o.c) { const k = o.c.k, set = (a) => { const t = tint(a); a[0] = t[0]; a[1] = t[1]; a[2] = t[2]; }; if (Array.isArray(k) && typeof k[0] === "number") set(k); else if (Array.isArray(k)) k.forEach((f) => ["s", "e"].forEach((n) => Array.isArray(f[n]) && set(f[n]))); }
  if ((o.ty === "gf" || o.ty === "gs") && o.g && o.g.k) { const n = Number(o.g.p) || 0, fix = (a) => { for (let i = 0; i < n; i++) a.splice(i * 4 + 1, 3, ...tint(a.slice(i * 4 + 1, i * 4 + 4))); }; const k = o.g.k.k; if (Array.isArray(k) && typeof k[0] === "number") fix(k); else if (Array.isArray(k)) k.forEach((f) => ["s", "e"].forEach((m) => Array.isArray(f[m]) && fix(f[m]))); }
  Object.values(o).forEach(walk); }
fetch("/icons/wallet_gift.json").then((r) => r.json()).then((d) => { walk(d); document.querySelectorAll("[data-g]").forEach((c) => lottie.loadAnimation({ container: c, renderer: "svg", loop: true, autoplay: true, animationData: JSON.parse(JSON.stringify(d)) })); });
</script></body></html>
