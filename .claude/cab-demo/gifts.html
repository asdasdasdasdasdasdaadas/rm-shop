<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цвет подарка</title><link rel="stylesheet" href="/cab.css">
<style>
body { background: #0b0c0f; padding: 20px 12px 40px; }
h1 { color: #fff; font-size: 22px; margin: 0 8px 4px; } p.s { color: #9aa0ab; margin: 0 8px 18px; font-size: 14px; }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.v .hc { margin: 0; padding: 14px 16px 18px; animation: none; }
.v .lab { color: #fff; font-weight: 700; font-size: 17px; margin: 0 6px 8px; }
.v .lab span { color: #9aa0ab; font-weight: 500; font-size: 14px; }
.g { position: relative; height: 165px; }
.g .l { position: absolute; left: 50%; top: 4px; width: 315px; height: 159px; margin-left: -157.5px; }
.rays { position: absolute; left: 50%; top: 80px; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(255, 226, 140, .2) 0 7deg, transparent 7deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 18%, transparent 62%); mask: radial-gradient(circle, #000 18%, transparent 62%); animation: fbspin 18s linear infinite; }
.t { color: #fff; font-size: 30px; font-weight: 800; text-align: center; margin-top: 2px; }
</style></head><body>
<h1>Цвет подарка</h1><p class="s">Один и тот же подарок Wallet, перекрашенный. Карточка — как на экране пополнения с бонусом.</p>
<div class="wall" id="w"></div>
<script src="/icons/lottie-light.min.js?v=5.12.2"></script>
<script>
const V = [
  ["1", "Синий", "как в Wallet, без перекраски", null],
  ["2", "Белый", "золотая лента", { box: [45, 0.08, 0.86, 0.14], rib: [42, 1, null, 0] }],
  ["3", "Розовый", "белая лента", { box: [330, 0.85, null, 0.08], rib: [0, 0.05, 0.9, 0.1] }],
  ["4", "Зелёный", "как лягушка, золотая лента", { box: [145, 0.8, null, 0.02], rib: [42, 1, null, 0.04] }],
  ["5", "Красный", "золотая лента, классика", { box: [356, 0.85, null, 0], rib: [43, 1, null, 0.06] }],
  ["6", "Бирюзовый", "розовая лента", { box: [178, 0.75, null, 0.02], rib: [335, 0.9, null, 0.06] }],
];
const hsl = (r, g, b) => { const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn; if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1)); let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return [(h * 60 + 360) % 360, s, l]; };
const rgb = (h, s, l) => { const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x]; return [r + m, g + m, b + m]; };
// [hue, saturation (×, or a fixed value when < 0.2), lightness base (null = keep), lightness add]
const tint = (P) => (c) => { const [h, s, l] = hsl(c[0], c[1], c[2]); if (s < 0.12) return c;
  const pick = h >= 190 && h <= 300 ? P.box : h >= 5 && h <= 45 ? P.rib : null; if (!pick) return c;
  const [H, S, Lb, La] = pick; const ns = S < 0.2 ? S : Math.min(1, s * S + 0.1); const nl = Lb == null ? Math.min(0.9, l + La) : Math.min(0.97, Lb + l * La);
  return rgb(H, ns, nl); };
function walk(o, f) { if (Array.isArray(o)) return o.forEach((x) => walk(x, f)); if (!o || typeof o !== "object") return;
  if ((o.ty === "fl" || o.ty === "st") && o.c) { const k = o.c.k; const set = (a) => { const t = f(a); a[0] = t[0]; a[1] = t[1]; a[2] = t[2]; };
    if (Array.isArray(k) && typeof k[0] === "number") set(k); else if (Array.isArray(k)) k.forEach((fr) => ["s", "e"].forEach((n) => Array.isArray(fr[n]) && set(fr[n]))); }
  if ((o.ty === "gf" || o.ty === "gs") && o.g && o.g.k) { const n = Number(o.g.p) || 0, fix = (a) => { for (let i = 0; i < n; i++) a.splice(i * 4 + 1, 3, ...f(a.slice(i * 4 + 1, i * 4 + 4))); };
    const k = o.g.k.k; if (Array.isArray(k) && typeof k[0] === "number") fix(k); else if (Array.isArray(k)) k.forEach((fr) => ["s", "e"].forEach((m) => Array.isArray(fr[m]) && fix(fr[m]))); }
  Object.values(o).forEach((v) => walk(v, f)); }
const w = document.getElementById("w");
w.innerHTML = V.map(([n, t, sub]) => `<div class="v"><div class="lab">${n}. ${t} <span>· ${sub}</span></div><section class="hc fbon"><div class="g"><div class="rays"></div><div class="l" id="g${n}"></div></div><div class="t">200 ₽</div></section></div>`).join("");
fetch("/icons/wallet_gift.json").then((r) => r.json()).then((base) => V.forEach(([n, , , P]) => {
  const d = JSON.parse(JSON.stringify(base)); if (P) walk(d, tint(P));
  lottie.loadAnimation({ container: document.getElementById("g" + n), renderer: "svg", loop: true, autoplay: true, animationData: d });
}));
</script></body></html>
