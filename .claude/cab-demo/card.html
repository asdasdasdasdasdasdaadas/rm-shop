<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="/cab.css">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
.wrap { width: 360px; height: 189px; zoom: 3.3333; }
.gs-art { width: 360px; height: 189px; aspect-ratio: auto; }
.gs-art .gs-rays { animation: none; }
.gs-art .cf { position: absolute; width: 4px; height: 7px; border-radius: 1.5px; z-index: 0; }
.gs-art .cf.sn { border-radius: 50%; background: #fff; }
.gs-art .cf.sp { background: #ffd76a; box-shadow: 0 0 4px 1px rgba(255, 215, 106, .7); }
</style></head><body><div class="wrap" id="w"></div>
<script src="/icons/lottie-light.min.js?v=5.12.2"></script>
<script>
const T = {
  t1: { name: "Фиолетовый", bg: "th1", ray: "rgba(255,226,140,.18)", conf: ["#ffd76a", "#fff", "#c9b2ff"], box: [45, 0.08, (l) => Math.min(0.97, 0.86 + l * 0.14)], rib: [42, null] },
  t2: { name: "Праздничный", bg: "th2", ray: "rgba(255,226,140,.16)", conf: ["#ffd76a", "#ff5a5a", "#fff"], box: [356, 0.72, (l) => Math.min(0.62, 0.3 + l * 0.45)], rib: [44, null] },
  t3: { name: "Золотой", bg: "th3", ray: "rgba(255,215,106,.14)", conf: ["#ffd76a", "#f7b733", "#fff3c4"], box: [43, 0.85, (l) => Math.min(0.72, 0.38 + l * 0.42)], rib: [230, 0.12, (l) => Math.max(0.1, l * 0.35)] },
  t4: { name: "Закатный", bg: "th4", ray: "rgba(255,255,255,.2)", conf: ["#fff", "#7ff0c8", "#ffe08a"], box: [160, 0.55, (l) => Math.min(0.82, 0.5 + l * 0.35)], rib: [40, 0.06, (l) => Math.min(0.98, 0.8 + l * 0.2)] },
  t5: { ny: 1, fx: "snow", ray: "rgba(190,220,255,.14)", box: [205, 0.6, (l) => Math.min(0.86, 0.6 + l * 0.3)], rib: [210, 0.1, (l) => Math.min(0.98, 0.84 + l * 0.16)] },
  t6: { ny: 1, fx: "snow", gar: 1, ray: "rgba(255,226,140,.12)", box: [45, 0.08, (l) => Math.min(0.97, 0.86 + l * 0.14)], rib: [356, 0.78, (l) => Math.min(0.6, 0.34 + l * 0.4)] },
  t7: { ny: 1, fx: "spark", ray: "rgba(255,190,110,.16)", box: [27, 0.95, (l) => Math.min(0.64, 0.42 + l * 0.32)], rib: [128, 0.55, (l) => Math.min(0.5, 0.24 + l * 0.34)] },
};
function hue(r, g, b) { const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn; if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1)); let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return [(h * 60 + 360) % 360, s, l]; }
function rgb(h, s, l) { const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x]; return [r + m, g + m, b + m]; }
const tintBy = (p) => (c) => { const [h, s, l] = hue(c[0], c[1], c[2]); if (s < 0.12) return c;
  if (h >= 190 && h <= 300) return rgb(p.box[0], p.box[1], p.box[2](l));
  if (h >= 5 && h <= 45) return p.rib[1] == null ? rgb(p.rib[0], Math.min(1, s + 0.1), Math.min(0.9, l)) : rgb(p.rib[0], p.rib[1], p.rib[2](l)); return c; };
function walkBy(o, t) { if (Array.isArray(o)) { o.forEach((x) => walkBy(x, t)); return; } if (!o || typeof o !== "object") return;
  if ((o.ty === "fl" || o.ty === "st") && o.c) { const k = o.c.k;
    if (Array.isArray(k) && typeof k[0] === "number") { const r = t(k); k[0] = r[0]; k[1] = r[1]; k[2] = r[2]; }
    else if (Array.isArray(k)) k.forEach((f) => ["s", "e"].forEach((n) => { if (Array.isArray(f[n])) { const r = t(f[n]); f[n][0] = r[0]; f[n][1] = r[1]; f[n][2] = r[2]; } })); }
  if ((o.ty === "gf" || o.ty === "gs") && o.g && o.g.k) { const n = Number(o.g.p) || 0, fix = (a) => { for (let i = 0; i < n; i++) { const r = t(a.slice(i * 4 + 1, i * 4 + 4)); a.splice(i * 4 + 1, 3, ...r); } };
    const k = o.g.k.k; if (Array.isArray(k) && typeof k[0] === "number") fix(k); else if (Array.isArray(k)) k.forEach((f) => ["s", "e"].forEach((m) => Array.isArray(f[m]) && fix(f[m]))); }
  Object.values(o).forEach((x) => walkBy(x, t)); }
const raw = fetch("/icons/wallet_gift.json").then((r) => r.json());
const byT = {};
const giftFor = (t) => (byT[t] = byT[t] || raw.then((d) => { const c = JSON.parse(JSON.stringify(d)); walkBy(c, tintBy(T[t])); return c; }));
const play = (box, t, speed = 1) => giftFor(t).then((d) => { box.innerHTML = ""; const a = lottie.loadAnimation({ container: box, renderer: "svg", loop: true, autoplay: true, animationData: JSON.parse(JSON.stringify(d)) }); a.setSpeed(speed); return a; });


const K = { violet: "t1", festive: "t2", gold: "t3", sunset: "t4", snow: "t5", tree: "t6", tangerine: "t7" };
// m=2: the New Year broadcast card (three festive gifts, «Подарите VPN на праздники»).
const q = new URLSearchParams(location.search), s = q.get("s") || "violet", promo = q.get("m") === "2", many = q.get("m") === "1" || promo, t = K[s], P = T[t];
let seed = 7; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
const conf = Array.from({ length: P.fx ? 34 : 26 }, (_, i) => {
  if (!P.fx) return `<i class="cf" style="left:${(rnd() * 100).toFixed(1)}%;top:${(rnd() * 70).toFixed(1)}%;background:${P.conf[i % 3]};opacity:${(0.5 + rnd() * 0.45).toFixed(2)};transform:rotate(${(rnd() * 180).toFixed(0)}deg)"></i>`;
  const spark = P.fx === "spark" && i % 3 === 0, sz = spark ? 2.2 : (1.4 + rnd() * 2.4).toFixed(1);
  return `<i class="cf sn${spark ? " sp" : ""}" style="left:${(rnd() * 100).toFixed(1)}%;top:${(rnd() * 70).toFixed(1)}%;width:${sz}px;height:${sz}px;opacity:${(0.45 + rnd() * 0.5).toFixed(2)}"></i>`;
}).join("");
const title = promo ? ["Подарите VPN на праздники", "300, 500 или 1 000 ₽ — с вашим поздравлением"]
  : P.ny ? (many ? ["Подарки к Новому году", "Кто первый — того и подарок"] : ["С Новым годом!", "Вам подарок на VPN — нажмите, чтобы открыть"])
  : many ? ["Подарки для всех в чате", "Кто первый — того и подарок"] : ["Вам подарок на VPN", "Нажмите, чтобы забрать — деньги сразу на баланс"];
// A sagging wire with bulbs (same as the cabinet's «Ёлка»); the bulbs blink in frame().
function garland(w, h) {
  const C = ["#ff5a5a", "#ffd76a", "#5fd38d", "#5fa8ff"], sag = 3, step = w / sag, pts = [];
  let d = "M0 2";
  for (let i = 0; i < sag; i++) { const x0 = i * step; d += ` Q${x0 + step / 2} ${h * 0.75} ${x0 + step} 2`;
    for (let j = 1; j < 6; j++) { const tt = j / 6; pts.push([x0 + step * tt, 2 + 2 * tt * (1 - tt) * (h * 0.75 - 2)]); } }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" stroke="rgba(0,0,0,.45)" stroke-width="1.2" fill="none"/>${pts.map(([x, y], i) =>
    `<circle cx="${x.toFixed(1)}" cy="${(y + 3.5).toFixed(1)}" r="3" fill="${C[i % 4]}" style="filter:drop-shadow(0 0 3px ${C[i % 4]})" data-ph="${(i * 0.23) % 1}"/>`).join("")}</svg>`;
}
document.getElementById("w").innerHTML = `<div class="gs-art"><i class="gs-${s}"></i><div class="gs-rays" style="--ray:${P.ray}"></div>${conf}${P.gar ? `<div class="gs-gar">${garland(360, 30)}</div>` : ""}
  <div class="lg"><img src="/icons/frog.png" alt="">Лягушка VPN</div>${many ? '<div class="gl"></div><div class="gr"></div>' : ""}<div class="g1"></div>
  <div class="tt">${title[0]}</div><div class="sb">${title[1]}</div></div>`;
// The broadcast card shows all three festive looks: «Снежный» in the middle, «Ёлка» and «Мандарины» at the sides.
const look = (box) => (promo ? (box.classList.contains("gl") ? "t6" : box.classList.contains("gr") ? "t7" : "t5") : t);
Promise.all([...document.querySelectorAll(".g1,.gl,.gr")].map((box, i) => giftFor(look(box)).then((d) => new Promise((ok) => {
  const a = lottie.loadAnimation({ container: box, renderer: "svg", loop: false, autoplay: false, animationData: JSON.parse(JSON.stringify(d)) });
  box._a = a;
  a.addEventListener("DOMLoaded", () => { a.goToAndStop(i ? 22 + i * 9 : 40, true); ok(); });
})))).then(() => { document.title = "ready"; });
// Animation for the MP4 card: frame f of N (30 fps). The gift loops every 94 Lottie frames (60 fps), rays turn one
// stripe (20deg), each confetti piece falls a whole number of times, so the last frame leads straight into the first.
const players = () => [...document.querySelectorAll(".g1,.gl,.gr")].map((b) => b._a);
document.querySelectorAll(".cf").forEach((c, i) => { c.dataset.y = parseFloat(c.style.top); c.dataset.k = 1 + (i % 2); c.dataset.r = (i * 37) % 360; });
window.frame = (f, N) => {
  const t = f / N;
  document.querySelectorAll(".g1,.gl,.gr").forEach((b, i) => b._a && b._a.goToAndStop(((f * 94 * 2) / N + i * 31) % 94, true));
  document.querySelector(".gs-rays").style.transform = `rotate(${t * 20}deg)`;
  document.querySelectorAll(".cf").forEach((c, i) => {
    const y = ((Number(c.dataset.y) + 115 * t * Number(c.dataset.k)) % 115) - 10;
    c.style.top = y + "%";
    // Snow sways side to side a whole number of times per loop; confetti spins.
    c.style.transform = c.classList.contains("sn") ? `translateX(${(Math.sin(2 * Math.PI * (t * 2 + (i % 7) / 7)) * 5).toFixed(2)}px)`
      : `rotate(${Number(c.dataset.r) + t * 360 * Number(c.dataset.k)}deg)`;
  });
  document.querySelectorAll(".gs-gar circle").forEach((c) => { c.style.opacity = (0.675 + 0.325 * Math.cos(2 * Math.PI * (t * 2 + Number(c.dataset.ph)))).toFixed(3); });
};
</script></body></html>
