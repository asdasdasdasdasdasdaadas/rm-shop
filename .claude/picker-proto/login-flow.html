<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — путь пользователя</title>
<link rel="stylesheet" href="cab.css">
<style>
body{background:#0a0b0d;overflow-x:hidden}
.top{max-width:1100px;margin:0 auto;padding:22px 20px 0}
.top h1{font-size:23px;margin:0;font-weight:800}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tabs button{height:38px;padding:0 14px;border-radius:99px;background:#17191e;color:#cfd5de;font-size:14px;font-weight:600}
.tabs button.on{background:#3e88f7;color:#fff}
.say{margin-top:14px;background:#14171c;border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.say .tx{flex:1;font-size:15px;line-height:1.5;color:#cfd5de}.say .tx b{color:#fff}
.say .tx small{display:block;margin-top:6px;color:#8b93a0;font-size:13px}
.say .rs{flex:none;color:#5ea8ff;font-size:14px;font-weight:600;height:30px}
.stage{max-width:1100px;margin:18px auto 50px;padding:0 20px;display:flex;flex-wrap:nowrap;gap:22px;justify-content:center;align-items:flex-start}
.stage.nodesk .dw{display:none}
.lbl{text-align:center;font-size:12px;color:#6b7280;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.phone{width:300px;height:620px;flex:none;border-radius:44px;border:9px solid #000;box-shadow:0 0 0 1.5px #2a2c33,0 30px 60px rgba(0,0,0,.5);position:relative;overflow:hidden;background:var(--bg);isolation:isolate}
.desk{width:540px;height:420px;flex:none;border-radius:14px;background:#1b1d22;box-shadow:0 0 0 1.5px #2a2c33,0 30px 60px rgba(0,0,0,.5);position:relative;overflow:hidden;isolation:isolate}
.desk .bar{height:38px;display:flex;align-items:center;gap:7px;padding:0 12px;background:#24262c}
.desk .bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.desk .bar i:nth-child(2){background:#febc2e}.desk .bar i:nth-child(3){background:#28c840}
.desk .url{margin-left:14px;flex:1;height:24px;border-radius:7px;background:#16181c;font-size:12px;color:#9aa0ab;display:flex;align-items:center;padding:0 10px}
.desk .scr{top:38px}
.desk .scr > .hc{max-width:380px;margin-left:auto;margin-right:auto}
.scr{position:absolute;inset:0;min-height:0;overflow-y:auto;scrollbar-width:none;padding:16px 0 30px;background:var(--bg)}
.scr::-webkit-scrollbar{display:none}
.scr.in{animation:slin .4s var(--ease) both;z-index:1}.scr.out{animation:slout .4s var(--ease) both}
@keyframes slin{from{transform:translateX(24%);opacity:0}}@keyframes slout{to{transform:translateX(-20%);opacity:0}}
.scr.tgs{background:#0e1621;padding:0;overflow:hidden}
.scr.web{padding-top:0}
.sbar{position:sticky;top:0;z-index:3;height:46px;padding-top:12px;display:flex;align-items:center;justify-content:center;background:#1b1d22;font-size:13px;color:#cfd5de;margin-bottom:14px}
.toast2{position:absolute;top:50px;left:50%;transform:translate(-50%,-20px);opacity:0;background:rgba(40,42,48,.97);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;white-space:nowrap;transition:all .35s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none}
.toast2.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.97)}}
@keyframes popin{from{opacity:0;transform:scale(.9)}}
.rise{animation:rise .45s var(--ease) both}
/* hint: what to press next */
.hint{position:relative;animation:hint 1.4s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(255,214,10,.0),0 0 0 2px rgba(255,214,10,.9)}50%{box-shadow:0 0 0 8px rgba(255,214,10,.18),0 0 0 2px rgba(255,214,10,.9)}}
[data-to],[data-x],[data-sc]{cursor:pointer}
/* login bits */
.hc .frogi{width:72px;height:72px;border-radius:50%}
.tgbtn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:99px;background:#2aabee;color:#fff;font-weight:700;font-size:17px;margin:20px 0 0;width:100%;box-shadow:0 8px 24px rgba(42,171,238,.35)}
.alt2{display:block;width:100%;text-align:center;color:rgba(255,255,255,.85);font-size:14.5px;margin-top:14px;text-decoration:underline;text-underline-offset:3px}
.qrrow{display:flex;gap:16px;align-items:center;margin-top:14px}
.qr{width:132px;height:132px;flex:none;background:#fff;border-radius:16px;padding:9px;position:relative}
.qr svg{width:100%;height:100%;display:block}
.qr .lg{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;background:#2aabee;border:3px solid #fff;display:flex;align-items:center;justify-content:center}
.qr.scan::after{content:"";position:absolute;left:8px;right:8px;height:3px;border-radius:2px;background:#3ccf74;box-shadow:0 0 12px #3ccf74;top:10px;animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 13px)}}
.steps3{display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:rgba(255,255,255,.85);text-align:left}
.steps3 b{color:#fff}
.wait{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-size:14.5px;color:rgba(255,255,255,.9)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.okc{width:80px;height:80px;border-radius:50%;background:#3ccf74;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;animation:popin .45s var(--ease) both;box-shadow:0 0 0 12px rgba(60,207,116,.18)}
.okc.red{background:#ff5a4f;box-shadow:0 0 0 12px rgba(255,90,79,.18)}
.big{font-size:56px;font-weight:800;letter-spacing:6px;text-align:center;margin-top:10px;line-height:1}
.code6{margin-top:16px;height:56px;border-radius:14px;background:rgba(0,0,0,.25);display:flex;align-items:center;padding:0 16px}
.code6 input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:26px;font-weight:800;letter-spacing:10px;color:#fff;text-align:center}
.code6 input::placeholder{color:rgba(255,255,255,.35);letter-spacing:10px}
.code6.bad{animation:shake .35s}.code6.ok{background:rgba(40,168,100,.6)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* telegram */
.tgh{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#17212b;margin-top:24px}
.tgh .av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none}.tgh .av img{width:100%;height:100%}
.tgh b{display:block;font-size:15.5px}.tgh span{font-size:12.5px;color:#7f91a4}
.tgb{position:absolute;left:0;right:0;top:80px;bottom:52px;overflow:hidden;padding:12px 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:#0e1621}
.msg{align-self:flex-start;max-width:92%;background:#182533;border-radius:16px 16px 16px 6px;padding:10px 12px 8px;font-size:14px;line-height:1.42;animation:rise .4s var(--ease) both}
.msg .tm{display:block;text-align:right;font-size:11px;color:#6d7f8f;margin-top:3px}
.msg .meta{display:grid;grid-template-columns:22px 1fr;gap:3px 6px;margin:8px 0 6px;font-size:13.5px;color:#c9d4de}
.msg.old{animation:none;opacity:.55}
.kb{display:grid;gap:4px;max-width:92%;width:92%;animation:rise .4s .1s var(--ease) both}
.kb.two{grid-template-columns:1fr 1fr}.kb.three{grid-template-columns:1fr 1fr 1fr}
.kb button{background:rgba(43,82,120,.85);border-radius:10px;padding:11px 6px;font-size:14px;font-weight:600;color:#fff}
.kb.three button{font-size:18px;font-weight:800;letter-spacing:1px}
.kb button.wide{grid-column:1/-1;font-size:14px;letter-spacing:0;font-weight:600}
.kb button.g{background:rgba(46,160,90,.9)}
.kb.dim button{opacity:.35;pointer-events:none}
.inbar{position:absolute;left:0;right:0;bottom:0;height:52px;background:#17212b;display:flex;align-items:center;padding:0 14px;color:#6d7f8f;font-size:14px}
.copy{font-size:22px;letter-spacing:2px;font-weight:800;background:rgba(94,168,255,.15);border-radius:8px;padding:2px 8px;display:inline-block;margin:4px 0}
/* camera */
.cam{position:absolute;inset:0;background:#000}
.cam .vf{position:absolute;inset:70px 22px 140px;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#2a2d33,#0b0c0e 75%);display:flex;align-items:center;justify-content:center}
.cam .vf .mini{width:110px;height:110px;background:#fff;border-radius:10px;padding:7px;transform:perspective(300px) rotateX(12deg) rotateZ(-4deg);opacity:.85}
.cam .vf .mini svg{width:100%;height:100%}
.cam .sh{position:absolute;bottom:44px;left:50%;width:62px;height:62px;margin-left:-31px;border-radius:50%;border:4px solid #fff}
.cam .md{position:absolute;top:34px;width:100%;text-align:center;font-size:12px;color:#ffd60a;font-weight:700;letter-spacing:.5px}
.cam .tip{position:absolute;bottom:118px;width:100%;text-align:center;font-size:13px;color:#fff;opacity:.8}
.banner{position:absolute;left:12px;right:12px;top:78px;background:rgba(44,44,48,.97);border-radius:16px;padding:11px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center;z-index:2;animation:rise .4s var(--ease) both;color:#cfd5de}
.banner .ic{width:30px;height:30px;border-radius:8px;background:#2aabee;display:flex;align-items:center;justify-content:center;flex:none}
.banner b{display:block;font-size:13.5px;color:#fff}
/* sessions */
.sess .cur{color:var(--grn);font-weight:600}
.rw .v.out{color:#ff6b6b;font-weight:600}
.endb{display:block;width:calc(100% - 24px);margin:14px 12px 0;height:50px;border-radius:16px;background:#2a1619;color:#ff6b6b;font-weight:700;font-size:15px}
.rw.gone{animation:gone .4s var(--ease) forwards}
@keyframes gone{to{opacity:0;transform:translateX(40px);height:0;padding-top:0;padding-bottom:0;margin:0;border:0}}
.sheet{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;animation:rise .25s both}
.sheet>div{width:100%;background:#1c1e23;border-radius:24px 24px 0 0;padding:20px 16px 26px;text-align:center}
.sheet b{font-size:17px;display:block}.sheet p{color:#9aa0ab;font-size:14px;margin:8px 0 16px;line-height:1.4}
.sheet button{display:block;width:100%;height:48px;border-radius:14px;font-weight:700;font-size:15.5px;margin-top:8px;background:#2a2c33;color:#fff}
.sheet button.red{background:#ff5a4f}
html.nofx *,html.nofx *::before,html.nofx *::after{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div class="top">
  <h1>Вход в кабинет — покликайте сами</h1>
  <div class="tabs" id="tabs"></div>
  <div class="say"><div class="tx" id="say"></div><button class="rs" id="rs">↻ Сначала</button></div>
</div>
<div class="stage" id="stage">
  <div class="dw"><div class="lbl">Компьютер</div><div class="desk" id="desk"><div class="bar"><i></i><i></i><i></i><span class="url">🔒 lk.frog-vpn.ru</span></div><div class="toast2"></div></div></div>
  <div><div class="lbl">Телефон</div><div class="phone" id="phone"><div class="toast2"></div></div></div>
</div>

<script>
const TG = (s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M21.5 4.3 2.9 11.5c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.4-1.5zM8.3 14.2l9.6-6c.5-.3.9-.1.5.2l-7.9 7.2-.3 3.4-1.9-4.8z" fill="#fff"/></svg>`;
const CHK = '<svg width="42" height="42" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS = '<svg width="38" height="38" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
const frog = (s) => `<img class="frogi" src="icons/frog.png" style="width:${s}px;height:${s}px" alt="">`;
const QR = (() => { let r = ""; let x = 7; const cell = () => { x = (x * 1103515245 + 12345) & 0x7fffffff; return (x >> 16) & 1; };
  const fin = (i, j) => (i < 7 && j < 7) || (i < 7 && j > 17) || (i > 17 && j < 7);
  for (let i = 0; i < 25; i++) for (let j = 0; j < 25; j++) {
    const on = fin(i, j) ? (() => { const a = i > 17 ? i - 18 : i, b = j > 17 ? j - 18 : j; return a === 0 || a === 6 || b === 0 || b === 6 || (a > 1 && a < 5 && b > 1 && b < 5); })() : cell();
    if (on) r += `<rect x="${j}" y="${i}" width="1" height="1"/>`; }
  return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges" fill="#111">${r}</svg>`; })();

// screens
const hero = (inner, h, p, color = "blue", noFrog) => `<section class="hc ${color}"><div class="ov"></div>${noFrog ? "" : `<div class="ill"><div>${frog(72)}</div></div>`}<div class="H">${h}</div><div class="P">${p}</div>${inner}</section>`;
const done = (h, p, red) => `<section class="hc ${red ? "slate" : "green"}"><div class="ov"></div><div class="okc ${red ? "red" : ""}">${red ? CROSS : CHK}</div><div class="H">${h}</div><div class="P">${p}</div></section>`;
const web = (html) => ({ html: `<div class="sbar">🔒 lk.frog-vpn.ru</div>${html}`, cls: "web" });
const tg = (body) => ({ html: `<div class="tgh"><span class="av"><img src="icons/frog.png" alt=""></span><span><b>Лягушка VPN</b><span>бот</span></span></div><div class="tgb">${body}</div><div class="inbar">Сообщение</div>`, cls: "tgs" });
const ask = (dev) => `<div class="msg old">Здравствуйте! Баланс: 46 ₽.<span class="tm">вчера</span></div><div class="msg">🔐 <b>Вход в кабинет</b><div class="meta"><span>${dev[0]}</span><span>${dev[1]}</span><span>📍</span><span>Москва, Россия</span><span>🕘</span><span>Сегодня, 21:40</span></div>Это вы входите?<br><span style="color:#8fa2b4;font-size:13px">Если нет — нажмите «Это не я», никто не войдёт.</span><span class="tm">21:40</span></div>`;
const nums = (dim) => `<div class="kb two ${dim ? "dim" : ""}"><button class="g" data-to="ok">✅ Да, это я</button><button data-to="deny">Это не я</button></div>`;
const bot = (t) => `<div class="msg">${t}<span class="tm">21:40</span></div>`;
const home = `<section class="hc green"><div class="ov"></div><div class="rb">VPN вкл</div><div class="ill"><div>${frog(60)}</div></div><div class="N">46 ₽</div><div class="P">Хватит на 7 дней · до 20 ноября</div></section><div class="st">Устройства · 2</div><div class="cd"><div class="rw"><span class="e">📱</span><span class="tt"><b>Мой iPhone</b><span>Подключено · 6 ₽ в день</span></span></div><div class="rw"><span class="e">💻</span><span class="tt"><b>Ноутбук</b><span>Подключено · 6 ₽ в день</span></span></div></div>`;
const camera = (banner) => `<div class="cam"><div class="md">QR-КОД</div><div class="vf" data-to="${banner ? "" : "scan"}"><div class="mini">${QR}</div></div><div class="tip">${banner ? "Код распознан" : "Наведите камеру на код на экране"}</div><div class="sh"></div>${banner ? `<div class="banner" data-to="tg"><span class="ic">${TG(18)}</span><span><b>Открыть в Telegram</b>t.me/frogvpn_bot?start=login_…</span></div>` : ""}</div>`;
const tgIdle = tg(`<div class="msg old">Здравствуйте! Баланс: 46 ₽.<span class="tm">вчера</span></div>`);
const sessRow = (k, e, n, d) => `<div class="rw" data-row="${k}"><span class="e">${e}</span><span class="tt"><b>${n}</b><span>${d}</span></span><button class="v out" data-x="rm">Выйти</button></div>`;
const sessList = `<section class="hc slate compact"><div class="ov"></div><div class="H">Где выполнен вход</div><div class="P">Кабинет открыт в 3 местах</div></section><div class="st">Сеансы</div><div class="cd sess"><div class="rw"><span class="e">📱</span><span class="tt"><b>Telegram на iPhone</b><span class="cur">● это устройство</span></span></div>${sessRow("w", "💻", "Chrome на Windows", "Москва · сегодня, 21:41")}${sessRow("m", "🖥️", "Safari на Mac", "Казань · 3 ноября")}</div><button class="endb" data-x="all">Выйти на всех других устройствах</button><div class="note">Видите незнакомый вход — нажмите «Выйти». Бот пишет о каждом новом входе.</div>`;

const SC = {
  pc: { t: "💻 С компьютера (QR)", desk: true, steps: {
    start: { desk: hero(`<div class="qrrow"><div class="qr">${QR}<span class="lg">${TG(16)}</span></div><div class="steps3"><span>1. Откройте <b>камеру</b> на телефоне</span><span>2. Наведите на код</span><span>3. Подтвердите вход в Telegram</span></div></div><span class="alt2" data-sc="nick">Нет телефона под рукой? Войти по нику</span>`, "Вход в кабинет", "Отсканируйте код телефоном"),
      phone: { html: camera(false), cls: "tgs" }, hint: ".vf",
      say: "Человек открыл <b>lk.frog-vpn.ru</b> на компьютере. Вместо поля для ника — QR-код. Нажмите на видоискатель камеры телефона, чтобы «навести» её на код.<small>Ник вводить не нужно: Telegram почти у всех на телефоне.</small>" },
    scan: { phone: { html: camera(true), cls: "tgs" }, hint: ".banner", enter: () => $d(".qr")?.classList.add("scan"),
      say: "Камера узнала ссылку на бота. Нажмите <b>«Открыть в Telegram»</b>." },
    tg: { desk: hero(`<div class="wait"><span class="spin"></span>Ждём подтверждения в Telegram</div>`, "Подтвердите вход", "Запрос уже в чате с ботом"),
      phone: tg(ask(["💻", "Chrome на Windows"]) + nums()), hint: '[data-to="ok"]',
      say: "В боте — запрос с данными входа: устройство, город, время. Нажмите <b>«Да, это я»</b>.<small>Можно нажать «Это не я» — увидите, что будет.</small>" },
    ok: { desk: done("Вы вошли", "Открываем кабинет…"), phone: tg(ask(["💻", "Chrome на Windows"]) + nums("ok") + bot("✅ Готово, компьютер вошёл в кабинет.")),
      auto: [1500, "home"], say: "Компьютер вошёл сам, без перезагрузки." },
    home: { desk: home, phone: tg(bot("🔔 <b>Новый вход в кабинет</b><br>Chrome на Windows · Москва · 21:41") + `<div class="kb"><button data-to="killed">Это не я — завершить сеанс</button></div>`), hint: "",
      say: "Готово: кабинет открыт, вход запомнен на год. Бот прислал уведомление о новом входе — если это был не человек, одна кнопка завершит сеанс. Можете нажать её и посмотреть." },
    killed: { desk: hero(`<button class="tgbtn" data-to="start">Войти снова</button>`, "Сеанс завершён", "Вход был отменён из Telegram", "slate", true),
      phone: tg(bot("🔔 <b>Новый вход в кабинет</b><br>Chrome на Windows · Москва · 21:41") + bot("Сеанс завершён — этот браузер вышел из кабинета.")),
      say: "Компьютер сразу вылетел из кабинета. Так человек исправит ошибку, даже если подтвердил чужой вход." },
    deny: { desk: hero(`<button class="tgbtn" data-to="start">Попробовать снова</button>`, "Вход отклонён", "Запрос отклонили в Telegram", "slate", true),
      phone: tg(ask(["💻", "Chrome на Windows"]) + nums(true) + bot("🚫 Вход отклонён, никто не вошёл. Ничего делать не нужно.")),
      say: "«Это не я» — чужой браузер ничего не получает." },
  } },
  phone: { t: "📱 С телефона (кнопка)", steps: {
    start: { phone: web(hero(`<button class="tgbtn" data-to="tg">${TG()}Войти через Telegram</button><span class="alt2" data-sc="nick">Войти по нику</span>`, "Вход в кабинет", "Лягушка VPN — устройства и баланс")), hint: '[data-to="tg"]',
      say: "Человек открыл <b>lk.frog-vpn.ru</b> в браузере на телефоне. Одна большая кнопка. Нажмите <b>«Войти через Telegram»</b>.<small>Работает и без ника — у многих его нет.</small>" },
    tg: { phone: tg(ask(["📱", "Safari на iPhone"]) + nums()), hint: '[data-to="ok"]',
      say: "Telegram открылся сам, в чате уже запрос входа. Нажмите <b>«Да, это я»</b>.<small>Или «Это не я» — посмотрите, что будет.</small>" },
    ok: { phone: tg(ask(["📱", "Safari на iPhone"]) + nums("ok") + bot("✅ Вход подтверждён.") + `<div class="kb"><button data-to="in">↩ Вернуться в браузер</button></div>`), hint: '[data-to="in"]',
      say: "Подтверждено. Нажмите <b>«Вернуться в браузер»</b> (или просто переключитесь на вкладку — она уже открыла кабинет)." },
    in: { phone: web(done("Вы вошли", "Открываем кабинет…")), auto: [1300, "home"], say: "Браузер вошёл сам." },
    home: { phone: web(home), say: "Готово: кабинет открыт в браузере, вход запомнен на год. Всего два нажатия: кнопка на сайте и «Да, это я» в боте." },
    deny: { phone: tg(ask(["📱", "Safari на iPhone"]) + nums(true) + bot("🚫 Вход отклонён, никто не вошёл. Ничего делать не нужно.")),
      say: "«Это не я» — никто не войдёт. Такое пригодится, если ссылку на вход прислал мошенник." },
  } },
  sess: { t: "🔐 Где выполнен вход", steps: {
    start: { phone: { html: home + `<div class="st">Безопасность</div><div class="cd"><div class="rw" data-to="list"><span class="e">🔐</span><span class="tt"><b>Где выполнен вход</b><span>3 устройства</span></span><span class="v">›</span></div></div>` }, hint: '[data-to="list"]',
      say: "Кабинет в Telegram. Внизу — новый пункт <b>«Где выполнен вход»</b>. Нажмите его (прокрутите вниз, если не видно)." , enter: () => { const s = $p(".scr"); s.scrollTop = s.scrollHeight; } },
    list: { phone: { html: sessList }, hint: ".endb",
      say: "Список браузеров, где открыт кабинет: устройство, город, время. Нажмите <b>«Выйти»</b> у любого или <b>«Выйти на всех других устройствах»</b>.",
      x: { rm: (el) => { const r = el.closest(".rw"); r.classList.add("gone"); toast($p, "Вышли: " + r.querySelector("b").textContent); setTimeout(() => r.remove(), 400); },
        all: () => $p(".scr").insertAdjacentHTML("beforeend", `<div class="sheet"><div><b>Выйти на других устройствах?</b><p>Кабинет закроется во всех браузерах, кроме этого телефона.</p><button class="red" data-x="allyes">Выйти везде</button><button data-x="no">Отмена</button></div></div>`),
        no: () => $p(".sheet").remove(),
        allyes: () => { $p(".sheet").remove(); $p(".scr").querySelectorAll("[data-row]").forEach((r) => { r.classList.add("gone"); setTimeout(() => r.remove(), 400); }); toast($p, "Вы вышли на всех других устройствах"); $p(".hc .P").textContent = "Кабинет открыт только здесь"; $p(".endb").remove(); setSay("Готово: остался только этот телефон. Все остальные браузеры при следующем действии увидят экран входа."); } } },
  } },
  nick: { t: "⌨️ Запасной: по нику", desk: true, steps: {
    start: { desk: hero(`<div class="inp"><input placeholder="@username" data-k="nick"></div><button class="pill" style="margin-top:14px;width:100%" data-to="tg"><span>Войти</span></button><span class="alt2" data-sc="pc">Войти по QR-коду</span>`, "Вход по нику", "Пришлём запрос в чат с ботом"),
      phone: tgIdle, hint: '[data-to="tg"]',
      say: "Запасной путь — если телефона с камерой нет рядом. Ник уже введён, нажмите <b>«Войти»</b>.",
      enter: () => { const i = $d('[data-k="nick"]'); i.value = "@ivan_petrov"; } },
    tg: { desk: hero(`<div class="wait"><span class="spin"></span>Ждём подтверждения в Telegram</div>`, "Подтвердите вход", "Запрос отправлен в чат с ботом"),
      phone: tg(ask(["💻", "Chrome на Windows"]) + nums()), hint: '[data-to="ok"]',
      say: "Тот же запрос, что и при входе по QR. Нажмите <b>«Да, это я»</b>." },
    ok: { phone: tg(ask(["💻", "Chrome на Windows"]) + nums("ok") + bot("✅ Готово, компьютер вошёл в кабинет.")), desk: done("Вы вошли", "Открываем кабинет…"), auto: [1300, "home"], say: "Компьютер вошёл сам." },
    deny: { desk: hero(`<button class="tgbtn" data-to="start">Попробовать снова</button>`, "Вход отклонён", "Запрос отклонили в Telegram", "slate", true),
      phone: tg(ask(["💻", "Chrome на Windows"]) + nums(true) + bot("🚫 Вход отклонён, никто не вошёл. Ничего делать не нужно.")), say: "«Это не я» — никто не войдёт." },
    home: { desk: home, say: "Готово. Ник нужно помнить, поэтому этот путь спрятан под ссылкой, а главный — QR и кнопка." },
  } },
};

const desk = document.getElementById("desk"), phone = document.getElementById("phone"), stage = document.getElementById("stage");
const $d = (s) => desk.querySelector(s), $p = (s) => phone.querySelector(s);
const toast = (q, t) => { const e = q(".toast2"); e.textContent = t; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 1800); };
const setSay = (h) => { document.getElementById("say").innerHTML = h; };
function put(host, v, anim) {
  const o = host.querySelector(".scr"); const s = document.createElement("div");
  const x = typeof v === "string" ? { html: v } : v;
  s.className = "scr" + (x.cls ? " " + x.cls : "") + (anim ? " in" : ""); s.innerHTML = x.html;
  host.insertBefore(s, host.querySelector(".toast2"));
  if (o) { if (anim) { o.classList.add("out"); o.style.pointerEvents = "none"; setTimeout(() => o.remove(), 400); } else o.remove(); }
}
let cur = "pc", st = "start", timer;
function show(sc, step) {
  clearTimeout(timer);
  const fresh = sc !== cur || step === "start";
  if (sc !== cur) { desk.querySelectorAll(".scr").forEach((e) => e.remove()); phone.querySelectorAll(".scr").forEach((e) => e.remove()); }
  cur = sc; st = step;
  const S = SC[sc], p = S.steps[step];
  stage.classList.toggle("nodesk", !S.desk); fit();
  if (fresh && !phone.querySelector(".scr") && !p.phone) put(phone, tgIdle, false);
  if (p.desk) put(desk, p.desk, !fresh);
  if (p.phone) put(phone, p.phone, !fresh);
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.sc === sc));
  setSay(p.say);
  if (p.enter) p.enter();
  // hint on the newest screens only
  document.querySelectorAll(".hint").forEach((e) => e.classList.remove("hint"));
  if (p.hint) [desk, phone].forEach((h) => { const s = [...h.querySelectorAll(".scr:not(.out)")].pop(); s && s.querySelectorAll(p.hint).forEach((e) => e.classList.add("hint")); });
  if (p.auto) timer = setTimeout(() => show(sc, p.auto[1]), p.auto[0]);
}
// keep the computer and the phone side by side: shrink the stage to fit narrow windows
const fit = () => { const w = (SC[cur].desk ? 540 + 22 : 0) + 300 + 40; stage.style.zoom = Math.min(1, innerWidth / w); };
addEventListener("resize", fit);
document.getElementById("tabs").innerHTML = Object.entries(SC).map(([k, v]) => `<button data-sc="${k}">${v.t}</button>`).join("");
document.getElementById("rs").onclick = () => show(cur, "start");
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-to],[data-x],[data-sc]"); if (!t || t.closest(".scr.out")) return;
  if (t.dataset.sc) return show(t.dataset.sc, "start");
  if (t.dataset.to) return show(cur, t.dataset.to);
  const f = SC[cur].steps[st].x?.[t.dataset.x]; if (f) f(t);
});
if (new URLSearchParams(location.search).has("nofx")) document.documentElement.classList.add("nofx");
show(new URLSearchParams(location.search).get("sc") || "pc", "start");
</script>
