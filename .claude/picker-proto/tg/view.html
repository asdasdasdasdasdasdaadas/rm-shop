<!doctype html><body style="margin:0;background:#3d4ea3;display:flex;gap:10px;flex-wrap:wrap">
<script src="lottie-light.min.js"></script><div id=w style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script>
const F=[0,30,60,90,120,150,179];
for (const name of ["premium_gift","gift_wallet"]) for (const f of F){ const d=document.createElement("div"); d.style.cssText="width:150px;height:150px;background:rgba(0,0,0,.1)"; w.appendChild(d);
 const a=lottie.loadAnimation({container:d,renderer:"svg",loop:false,autoplay:false,path:name+".json"}); a.addEventListener("DOMLoaded",()=>a.goToAndStop(f,true)); }
</script>
