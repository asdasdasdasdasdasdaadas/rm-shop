<script>
const L=(el,p)=>lottie.loadAnimation({container:el,renderer:"svg",loop:false,autoplay:false,path:p});
const as=[L(a,"wallet_gift_lid.json"),L(b,"wallet_gift_body.json"),L(c1,"wallet_gift_body.json"),L(c2,"wallet_gift_lid.json")];
