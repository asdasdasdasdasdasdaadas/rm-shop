<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Автопополнение — путь клиента, 7 вариантов</title>
<link rel="stylesheet" href="cab.css">
<style>
body{background:#0a0b0d;overflow-x:hidden}
.top{padding:22px 28px 4px;max-width:1720px;margin:0 auto;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;font-weight:800}.top p{margin:6px 0 0;color:#9aa0ab;font-size:14px;max-width:820px;line-height:1.45}
.top .ctl{margin-left:auto;display:flex;gap:8px}
.top .ctl button{padding:9px 16px;border-radius:12px;background:#1c1e23;font-size:14px;font-weight:600}
.top .ctl button.on{background:#3e88f7}
.row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;padding:18px 20px 50px}
.col{width:min(340px,calc(100vw - 32px))}
.cap{margin:12px 6px 0}.cap b{font-size:17px}.cap p{margin:4px 0 0;color:#9aa0ab;font-size:13.5px;line-height:1.45}
.now{display:flex;align-items:center;gap:8px;margin:10px 6px 0;min-height:22px;font-size:13.5px;color:#cfd5de}
.now i{font-style:normal;background:#3e88f7;color:#fff;border-radius:99px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.dots2{display:flex;gap:4px;margin:8px 6px 0}.dots2 span{flex:1;height:3px;border-radius:9px;background:#2a2d34;transition:background .3s}.dots2 span.on{background:#3e88f7}
.rp{margin:10px 6px 0;font-size:13.5px;color:#5ea8ff;font-weight:600}
.phone{width:100%;height:720px;border-radius:46px;border:9px solid #000;box-shadow:0 0 0 1.5px #2a2c33,0 30px 60px rgba(0,0,0,.5);position:relative;overflow:hidden;background:var(--bg);isolation:isolate}
.stage{position:absolute;inset:0}
.phone .scr{position:absolute;inset:0;min-height:0;overflow:hidden;padding:16px 0 30px;z-index:1}
.phone .scr.ghost{position:absolute;max-width:none;z-index:0}
.phone .scr.ghost.leaveB{z-index:2}
.frog{width:78px;height:78px}
.pressed{transform:scale(.95)!important;transition:transform .12s}
.finger{position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.9);z-index:50;opacity:0;pointer-events:none;
  transition:transform .6s cubic-bezier(.3,.8,.3,1),opacity .3s;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.finger.on{opacity:1}.finger.press{width:38px;background:rgba(255,255,255,.6)}
.finger::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid #fff;opacity:0}
.finger.press::after{animation:ring .45s ease-out}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.1)}}
/* pieces */
.sw2{width:51px;height:31px;border-radius:99px;background:#3a3d45;position:relative;flex-shrink:0;transition:background .3s}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.sw2.on{background:var(--grn)}.sw2.on::after{transform:translateX(20px)}
.apb{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:7px 14px 7px 11px;border-radius:99px;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);font-size:13.5px;white-space:nowrap;font-weight:600;animation:pop .6s .5s var(--ease) both}
.big-btn{display:block;padding:15px;border-radius:16px;background:var(--blue);color:#fff;font-size:16.5px;font-weight:600;text-align:center;width:100%;transition:transform .15s}
.later{display:block;text-align:center;color:var(--hint);font-size:14.5px;margin-top:12px;width:100%}
.offer{margin:14px 12px 0;background:var(--card);border-radius:22px;padding:18px 18px 16px}
.offer .h{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600}
.offer .h .ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(160deg,#5fb4ff,#1d63d6);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.offer p{margin:10px 0 0;color:var(--hint);font-size:14.5px;line-height:1.42}.offer p b{color:#fff;font-weight:600}
.offer .big-btn{margin-top:14px}
.rise{animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(46px) scale(.97)}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cmp div{background:#121317;border-radius:14px;padding:10px;font-size:13.5px;line-height:1.35;color:var(--hint);animation:rise .5s var(--ease) both}
.cmp div:nth-child(2){animation-delay:.18s}
.cmp div b{display:block;color:#fff;font-size:14px;margin-bottom:4px}
.cmp .good{background:rgba(60,207,116,.12);box-shadow:inset 0 0 0 1.5px rgba(60,207,116,.45)}
.inrow{display:flex;align-items:center;gap:12px;margin-top:16px;background:rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;text-align:left;animation:rise .6s var(--ease) both}
.inrow .tt{display:flex;flex-direction:column;min-width:0;flex:1}.inrow .tt b{color:#fff;font-size:15.5px}.inrow .tt span{font-size:13.5px;color:rgba(255,255,255,.85)}
.inrow .sw2{background:rgba(0,0,0,.25)}.inrow .sw2.hint{animation:nudge 1.2s .8s 2}
@keyframes nudge{30%{transform:scale(1.12)}60%{transform:scale(.96)}}
.gift{display:inline-block;background:#ffd25e;color:#4a2a00;font-weight:700;font-size:12.5px;border-radius:99px;padding:3px 9px;margin-bottom:8px;animation:wig .8s .7s 2}
@keyframes wig{20%{transform:rotate(-6deg) scale(1.1)}40%{transform:rotate(5deg) scale(1.1)}60%{transform:rotate(-3deg)}80%{transform:none}}
.tlx .tl{animation:rise .5s var(--ease) both}
.tlx .tl:nth-child(2){animation-delay:.35s}.tlx .tl:nth-child(3){animation-delay:.7s}
.sheetwrap{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;animation:fadein .35s both}
@keyframes fadein{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px 26px;text-align:center;animation:sheet .55s var(--ease) both}
@keyframes sheet{from{transform:translateY(100%)}}
.sheetwrap.out{animation:fadeout .3s both}.sheetwrap.out .sheet{animation:sheetout .35s both}
@keyframes fadeout{to{opacity:0}}@keyframes sheetout{to{transform:translateY(100%)}}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:#3a3d45;margin:0 auto 14px}
.sheet h3{margin:8px 0 6px;font-size:21px}.sheet p{margin:0;color:var(--hint);font-size:14.5px;line-height:1.42}
.sheet .big-btn{margin-top:16px}
.ticks{text-align:left;margin:14px 0 0;padding:0;list-style:none}.ticks li{padding:5px 0;font-size:14.5px;animation:rise .45s var(--ease) both}
.ticks li:nth-child(2){animation-delay:.12s}.ticks li:nth-child(3){animation-delay:.24s}
.ticks li::before{content:"✓";color:var(--grn);font-weight:700;margin-right:8px}
.toast2{position:absolute;left:14px;right:14px;top:18px;z-index:40;background:#2a2d34;border-radius:16px;padding:12px 14px;font-size:14.5px;font-weight:600;display:flex;gap:10px;align-items:center;
  box-shadow:0 12px 30px rgba(0,0,0,.45);animation:tin .45s var(--ease) both}
.toast2.out{animation:tout .35s both}
@keyframes tin{from{opacity:0;transform:translateY(-30px)}}@keyframes tout{to{opacity:0;transform:translateY(-30px)}}
.chk{animation:pop .6s var(--ease) both}
.conf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;z-index:30;animation:fall 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(760px) rotate(540deg);opacity:.2}}
.spin{width:64px;height:64px;border-radius:50%;border:5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* telegram */
.chat{position:absolute;inset:0;background:#0e1621;padding-top:14px}
.tgbar{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.tgbar .av{width:38px;height:38px;border-radius:50%;overflow:hidden}.tgbar .av img{width:38px;height:38px}
.tgbar b{font-size:15.5px;display:block}.tgbar span{font-size:13px;color:#7d8b99}
.feed{position:absolute;left:0;right:0;top:70px;bottom:0;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.day{text-align:center;margin:4px 0 10px}.day span{background:rgba(0,0,0,.35);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:99px}
.msg{animation:min .4s var(--ease) both;transform-origin:left bottom}
@keyframes min{from{opacity:0;transform:translateY(16px) scale(.96)}}
.bub{background:#182533;border-radius:16px 16px 16px 5px;padding:9px 12px 7px;font-size:14.5px;line-height:1.38;max-width:92%;color:#fff}
.bub .t{float:right;font-size:11.5px;color:#6d7f8f;margin:6px 0 0 10px}.bub b{font-weight:600}
.bub .q{border-left:3px solid #5ea8ff;padding:2px 0 2px 9px;margin-top:6px;color:#c9d4de}
.kb{display:grid;gap:4px;margin:4px 0 12px;max-width:92%}.kb.two{grid-template-columns:1fr 1fr}
.kb div{background:rgba(70,95,120,.35);border-radius:10px;padding:9px;text-align:center;font-size:14px;font-weight:600;color:#fff;transition:transform .12s}
.typing{display:inline-flex;gap:4px;background:#182533;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.typing span{width:7px;height:7px;border-radius:50%;background:#7d8b99;animation:tp 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{30%{transform:translateY(-4px);opacity:1}0%,60%,100%{opacity:.4}}
.webapp{position:absolute;left:0;right:0;bottom:0;top:46px;border-radius:16px 16px 0 0;background:var(--bg);z-index:20;animation:sheet .5s var(--ease) both;overflow:hidden}
.webapp.out{animation:sheetout .4s both}
.webapp .wh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-weight:600;font-size:15px;border-bottom:1px solid rgba(255,255,255,.06)}
.webapp .stage{top:46px}
.tgalert{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:rgba(30,32,38,.95);border-radius:12px;padding:10px 16px;font-size:14px;z-index:45;animation:tin .3s both;white-space:nowrap}
</style>
</head>
<body>
<div class="top">
  <div><h1>Автопополнение — путь клиента, 7 вариантов</h1>
  <p>Каждый телефон сам проигрывает путь: баланс заканчивается → «Пополнить» → оплата → успех → предложение автопополнения → включил → главная с новым статусом. Кружок — это палец клиента. Под телефоном — какой сейчас шаг.</p></div>
  <div class="ctl"><button id="slow">Медленнее</button><button id="all">Проиграть все заново</button></div>
</div>
<div class="row" id="row"></div>

<script>
const VARS = [
  { id: "A", t: "А. Карточка с кнопкой", d: "Отдельная карточка под успехом оплаты: «Не следить за балансом?» и два ответа." },
  { id: "B", t: "Б. Переключатель в карточке", d: "Тихо: строка с переключателем прямо в зелёной карточке, слегка «подпрыгивает», чтобы заметили." },
  { id: "C", t: "В. «Как сейчас / с автопополнением»", d: "Сравнение в две колонки, выгода видна без чтения." },
  { id: "D", t: "Г. С бонусом", d: "+1 день к каждому автопополнению — причина включить прямо сейчас." },
  { id: "E", t: "Д. Таймлайн", d: "По датам: когда спишем и что напишем. Пункты появляются по очереди." },
  { id: "F", t: "Е. Шторка снизу", d: "Через секунду после успеха выезжает шторка. Самый заметный вариант." },
  { id: "G", t: "Ж. В боте после оплаты", d: "Клиент платит из бота: после чека бот «печатает» и присылает вопрос с кнопками." },
];
const STEPS = ["Баланс заканчивается", "Выбирает сумму", "Оплата", "Успех", "Предложение", "Включил"];
let SPEED = 1;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms * SPEED));
const CHECK = '<svg class="chk" width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>';

const scr = {
  low: () => `<section class="hc orange"><div class="ov"></div><div class="rb">мало</div><div class="ill"><div><img class="frog" src="icons/frog.png" alt=""></div></div>
    <div class="N">12 ₽</div><div class="P">Хватит меньше чем на сутки</div><div class="acts"><button class="pill" data-k="topup"><span>Пополнить</span></button></div></section>
    <div class="st">Устройства</div><div class="cd"><div class="rw"><span class="e">📱</span><span class="tt"><b>iPhone</b><span><span class="dot"></span>Подключено · 6 ₽ в день</span></span><span class="v"><span class="cv">›</span></span></div></div>`,
  topup: () => `<section class="hc blue"><div class="ov"></div><div class="N" data-k="amt">500 ₽</div><div class="P" data-k="days">≈ 83 дня VPN</div>
    <div class="chp"><button>100</button><button data-k="c300">300</button><button class="on" data-k="c500">500</button><button>1 000</button><button>Своя</button></div>
    <div class="acts"><button class="pill" data-k="pay"><span data-k="payl">Оплатить 500 ₽</span></button></div></section>
    <div class="st">Способ оплаты</div><div class="cd"><div class="rw"><span class="e">💳</span><span class="tt"><b>Банковская карта</b><span>Visa, Mastercard, МИР</span></span><span class="v">Изменить <span class="cv">›</span></span></div></div>
    <div class="note c">Баланс 12 ₽</div>`,
  wait: () => `<section class="hc slate"><div class="ov"></div><div class="ill"><div style="display:flex;justify-content:center"><div class="spin"></div></div></div>
    <div class="H">Ждём оплату</div><div class="P">Открыли защищённую страницу · обычно до минуты</div></section>
    <div class="cd" style="margin-top:14px"><div class="tl"><div class="n ok">✓</div><div><div class="tx">Счёт создан</div><div class="sx">300 ₽ · карта</div></div></div>
    <div class="tl"><div class="n run">💳</div><div><div class="tx">Подтверждение в банке</div><div class="sx">не закрывайте страницу</div></div></div></div>`,
  ok: (extra) => `<section class="hc green"><div class="ov"></div><div class="ill"><div>${CHECK}</div></div><div class="N" data-k="sum">+0 ₽</div>
    <div class="P">Оплата прошла · хватит на 52 дня</div>${extra || ""}</section>`,
  home: () => `<section class="hc green"><div class="ov"></div><div class="rb">VPN вкл</div><div class="ill"><div><img class="frog" src="icons/frog.png" alt=""></div></div>
    <div class="N">312 ₽</div><div class="P">Хватит на 52 дня · до 7 января</div><div class="apb">🔁 5 января пополним 300 ₽</div>
    <div class="acts"><button class="pill"><span>Пополнить</span></button></div></section>
    <div class="st">Устройства</div><div class="cd"><div class="rw"><span class="e">📱</span><span class="tt"><b>iPhone</b><span><span class="dot"></span>Подключено · 6 ₽ в день</span></span><span class="v"><span class="cv">›</span></span></div></div>
    <div class="cd"><div class="rw"><span class="e">🔁</span>Автопополнение<span class="v">Вкл <span class="cv">›</span></span></div></div>`,
};
const devices = `<div class="st">Устройства</div><div class="cd"><div class="rw"><span class="e">📱</span><span class="tt"><b>iPhone</b><span><span class="dot"></span>Подключено · 6 ₽ в день</span></span><span class="v"><span class="cv">›</span></span></div></div>`;
const OFFERS = {
  A: `<div class="offer rise"><div class="h"><span class="ic">🔁</span>Не следить за балансом?</div><p>Когда останется <b>2 дня</b>, сами пополним на <b>300 ₽</b> с карты <b>•• 4242</b>. VPN не выключится в неудобный момент.</p><button class="big-btn" data-k="yes">Включить автопополнение</button><button class="later">Не сейчас</button></div>`,
  C: `<div class="offer rise"><div class="h"><span class="ic">🔁</span>VPN без перерывов</div><div class="cmp"><div><b>Как сейчас</b>Следить за балансом, пополнять, когда напомним</div><div class="good"><b>С автопополнением</b>300 ₽ спишем сами за 2 дня до конца</div></div><button class="big-btn" data-k="yes">Включить</button><button class="later">Оставить как есть</button></div>`,
  D: `<div class="offer rise"><span class="gift">+1 день в подарок</span><div class="h"><span class="ic">🔁</span>Включите автопополнение</div><p>Каждый раз, когда пополним автоматически, добавим <b>1 день VPN бесплатно</b>. Пополнение — <b>300 ₽</b>, когда останется 2 дня.</p><button class="big-btn" data-k="yes">Включить и получать бонус</button><button class="later">Не сейчас</button></div>`,
  E: `<div class="st rise">Как это будет</div><div class="cd tlx"><div class="tl"><div class="n ok">✓</div><div><div class="tx">Сегодня +300 ₽</div><div class="sx">VPN работает до 7 января</div></div></div>
     <div class="tl"><div class="n">⏳</div><div><div class="tx">5 января — осталось 2 дня</div><div class="sx">спишем 300 ₽ с •• 4242 и напишем в бот</div></div></div>
     <div class="tl"><div class="n">🔁</div><div><div class="tx">VPN не выключается</div><div class="sx">и так каждый раз, пока не отключите</div></div></div></div>
     <div style="margin:12px 12px 0" class="rise"><button class="big-btn" data-k="yes">Включить автопополнение</button><div class="note c" style="margin-top:10px">Не сейчас</div></div>`,
};

class Phone {
  constructor(v, host) {
    this.v = v;
    const col = document.createElement("div");
    col.className = "col";
    col.innerHTML = `<div class="phone"><div class="stage"></div><div class="finger"></div></div>
      <div class="dots2">${STEPS.map(() => "<span></span>").join("")}</div>
      <div class="now"><i>1</i><span></span></div>
      <div class="cap"><b>${v.t}</b><p>${v.d}</p></div><button class="rp">↻ Заново</button>`;
    host.appendChild(col);
    this.el = col.querySelector(".phone");
    this.stage = col.querySelector(".stage");
    this.f = col.querySelector(".finger");
    this.nowN = col.querySelector(".now i");
    this.nowT = col.querySelector(".now span");
    this.dots = [...col.querySelectorAll(".dots2 span")];
    col.querySelector(".rp").onclick = () => this.start();
    this.token = 0;
  }
  async w(ms) { const t = this.token; await sleep(ms); if (t !== this.token) throw "stop"; }
  step(i) {
    this.nowN.textContent = i + 1;
    this.nowT.textContent = STEPS[i];
    this.dots.forEach((d, k) => d.classList.toggle("on", k <= i));
  }
  show(html, dir = "f", host = this.stage) {
    const old = [...host.children].find((c) => c.classList.contains("scr") && !c.classList.contains("ghost"));
    const s = document.createElement("div");
    s.className = "scr " + (dir === "f" ? "enter" : dir === "b" ? "enterB" : "fade");
    s.innerHTML = html;
    if (old) { old.classList.add("ghost", dir === "b" ? "leaveB" : "leave"); setTimeout(() => old.remove(), 450); }
    host.appendChild(s);
    this.cur = s;
    return s;
  }
  q(k) { return this.el.querySelector(`[data-k="${k}"]`); }
  async tap(k) {
    const t = typeof k === "string" ? this.q(k) : k;
    if (!t) return;
    const r = t.getBoundingClientRect(), p = this.el.getBoundingClientRect();
    this.f.style.transform = `translate(${r.left - p.left + r.width / 2 - 19 - 9}px,${r.top - p.top + r.height / 2 - 19 - 9}px)`;
    this.f.classList.add("on");
    await this.w(700);
    this.f.classList.add("press"); t.classList.add("pressed");
    await this.w(240);
    this.f.classList.remove("press"); t.classList.remove("pressed");
    await this.w(120);
  }
  hideFinger() { this.f.classList.remove("on"); }
  count(el, to, pre = "+") {
    const t0 = performance.now();
    const tick = (now) => { const k = Math.min(1, (now - t0) / (900 * SPEED)); el.textContent = pre + Math.round(to * (1 - Math.pow(1 - k, 3))) + " ₽"; if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
  boom() {
    const c = ["#ffd25e", "#5fb4ff", "#3ccf74", "#ff7a6b", "#ffffff", "#b58cff"];
    for (let i = 0; i < 34; i++) {
      const s = document.createElement("span");
      s.className = "conf";
      s.style.cssText = `left:${Math.random() * 100}%;background:${c[i % c.length]};animation-delay:${Math.random() * .35}s;animation-duration:${1.2 + Math.random() * .9}s`;
      this.el.appendChild(s); setTimeout(() => s.remove(), 2600);
    }
  }
  async toast(text) {
    const t = document.createElement("div");
    t.className = "toast2"; t.innerHTML = `<span style="font-size:20px">🔁</span>${text}`;
    this.el.appendChild(t);
    await this.w(1500); t.classList.add("out"); await this.w(350); t.remove();
  }
  clean() {
    this.stage.innerHTML = "";
    this.el.querySelectorAll(".toast2,.conf,.sheetwrap,.webapp,.tgalert,.chat").forEach((x) => x.remove());
    this.hideFinger();
  }
  async start() {
    this.token++;
    this.clean();
    try { for (;;) { await (this.v.id === "G" ? this.bot() : this.cabinet()); await this.w(2600); this.clean(); } } catch (e) { if (e !== "stop") console.error(e); }
  }
  // ---------- the cabinet path (A–F) ----------
  async cabinet() {
    const v = this.v.id;
    this.step(0); this.show(scr.low(), "x");
    await this.w(1500); await this.tap("topup");
    this.step(1); this.show(scr.topup());
    await this.w(900); await this.tap("c300");
    this.q("c500").classList.remove("on"); this.q("c300").classList.add("on");
    this.q("amt").textContent = "300 ₽"; this.q("days").textContent = "≈ 50 дней VPN"; this.q("payl").textContent = "Оплатить 300 ₽";
    await this.w(600); await this.tap("pay");
    this.step(2); this.hideFinger(); this.show(scr.wait());
    await this.w(2200);
    this.step(3);
    const inner = v === "B" ? `<div class="inrow" style="animation-delay:1s"><span style="font-size:24px">🔁</span><span class="tt"><b>Пополнять автоматически</b><span>300 ₽, когда останется 2 дня</span></span><span class="sw2 hint" data-k="sw"></span></div>` : "";
    const s = this.show(scr.ok(inner), "x");
    this.boom(); this.count(this.q("sum"), 300);
    await this.w(1300);
    this.step(4);
    if (OFFERS[v]) s.insertAdjacentHTML("beforeend", OFFERS[v]);
    if (v === "B") s.insertAdjacentHTML("beforeend", devices + '<div class="note c rise">Карта •• 4242 сохранится, только если включите.</div>');
    if (v === "F") {
      s.insertAdjacentHTML("beforeend", devices);
      await this.w(900);
      this.el.insertAdjacentHTML("beforeend", `<div class="sheetwrap"><div class="sheet"><div class="grab"></div><img src="icons/frog.png" width="72" height="72" alt="" class="chk"><h3>Чтобы VPN не выключался</h3><p>Сами пополним баланс, когда он будет заканчиваться.</p><ul class="ticks"><li>300 ₽, когда останется 2 дня</li><li>Сообщение в бот после каждого списания</li><li>Отключить — в один тап</li></ul><button class="big-btn" data-k="yes">Включить</button><button class="later">Не сейчас</button></div></div>`);
    }
    await this.w(v === "E" ? 2600 : 2100);
    if (v === "B") { await this.tap("sw"); this.q("sw").classList.add("on"); await this.w(500); }
    else await this.tap("yes");
    this.step(5);
    const sheet = this.el.querySelector(".sheetwrap");
    if (sheet) { sheet.classList.add("out"); setTimeout(() => sheet.remove(), 400); }
    this.hideFinger();
    this.toast("Автопополнение включено");
    await this.w(900);
    this.show(scr.home(), "b");
    await this.w(2400);
  }
  // ---------- the bot path (G) ----------
  async bot() {
    this.el.insertAdjacentHTML("beforeend", `<div class="chat"><div class="tgbar"><span class="av"><img src="icons/frog.png" alt=""></span><div><b>Лягушка VPN</b><span>бот</span></div></div><div class="feed"></div></div>`);
    const feed = this.el.querySelector(".feed");
    const add = (html) => { feed.insertAdjacentHTML("beforeend", `<div class="msg">${html}</div>`); return feed.lastElementChild; };
    this.step(0);
    add(`<div class="day"><span>Сегодня</span></div>`);
    add(`<div class="bub">ℹ️ <b>Баланс на исходе</b><div class="q">Остаток 12 ₽ — меньше чем на сутки.</div><span class="t">10:00</span><div style="clear:both"></div></div><div class="kb"><div data-k="topup">Пополнить баланс</div><div>🤝 Обещанный платёж</div></div>`);
    await this.w(1600); await this.tap("topup");
    this.step(1); this.hideFinger();
    this.el.insertAdjacentHTML("beforeend", `<div class="webapp"><div class="wh"><span>✕ Закрыть</span><span>Лягушка VPN</span><span>⋯</span></div><div class="stage"></div></div>`);
    const app = this.el.querySelector(".webapp"), st = app.querySelector(".stage");
    this.show(scr.topup(), "x", st);
    await this.w(1000); await this.tap("c300");
    this.q("c500").classList.remove("on"); this.q("c300").classList.add("on");
    this.q("amt").textContent = "300 ₽"; this.q("days").textContent = "≈ 50 дней VPN"; this.q("payl").textContent = "Оплатить 300 ₽";
    await this.w(500); await this.tap("pay");
    this.step(2); this.hideFinger(); this.show(scr.wait(), "f", st);
    await this.w(2000);
    app.classList.add("out"); await this.w(400); app.remove();
    this.step(3);
    add(`<div class="bub">✅ <b>Баланс пополнен на 300 ₽</b><div class="q">Теперь 312 ₽ — хватит до 7 января.</div><span class="t">10:02</span><div style="clear:both"></div></div><div class="kb"><div>Личный кабинет</div></div>`);
    await this.w(1100);
    this.step(4);
    const typing = add(`<div class="typing"><span></span><span></span><span></span></div>`);
    await this.w(1300); typing.remove();
    const offer = add(`<div class="bub" data-k="ob">🔁 Хотите, чтобы VPN не выключался? Сами пополним на <b>300 ₽</b> с карты •• 4242, когда останется 2 дня. Отключить можно в любой момент.<span class="t">10:02</span><div style="clear:both"></div></div><div class="kb two" data-k="okb"><div data-k="yes">Включить</div><div>Не нужно</div></div>`);
    await this.w(2000); await this.tap("yes");
    this.step(5); this.hideFinger();
    this.el.insertAdjacentHTML("beforeend", `<div class="tgalert">Готово</div>`);
    setTimeout(() => { const a = this.el.querySelector(".tgalert"); if (a) a.remove(); }, 1100 * SPEED);
    const b = this.q("ob");
    b.style.transition = "opacity .25s"; b.style.opacity = ".3";
    await this.w(260);
    b.innerHTML = `🔁 <b>Автопополнение включено</b><div class="q">300 ₽ с •• 4242, когда останется 2 дня.<br>После каждого списания напишем сюда.</div><span class="t">10:02</span><div style="clear:both"></div>`;
    b.style.opacity = "1";
    this.q("okb").innerHTML = `<div>Настроить</div><div>Отключить</div>`;
    await this.w(2600);
  }
}

const row = document.getElementById("row");
const phones = VARS.map((v) => new Phone(v, row));
const startAll = () => phones.forEach((p, i) => setTimeout(() => p.start(), i * 350));
document.getElementById("all").onclick = startAll;
document.getElementById("slow").onclick = (e) => { SPEED = SPEED === 1 ? 1.8 : 1; e.target.classList.toggle("on", SPEED !== 1); startAll(); };
startAll();
</script>
</body>
</html>
