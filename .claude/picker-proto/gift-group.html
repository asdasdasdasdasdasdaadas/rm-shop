<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Подарки в группу</title>
<script src="tg/lottie-light.min.js"></script>
<style>
.pg{margin:0;background:#08090b;color:#f2f4f7;font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.pg-wrap{max-width:1000px;margin:0 auto;padding:32px 20px 80px}
.pg-h{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px}
.pg-lead{margin-top:8px;color:#979fab;font-size:15px;line-height:1.55;max-width:780px}
.pg-grid{display:flex;flex-wrap:wrap;gap:44px 48px;margin-top:34px;justify-content:center}
.pg-it{width:375px}
.pg-t{font-size:18px;font-weight:700;margin-bottom:4px}
.pg-d{color:#9aa1ab;font-size:13.5px;line-height:1.5;min-height:42px;margin-bottom:14px}
.pg-rp{margin-top:12px;font-size:13px;font-weight:600;color:#7cc0ff;background:#101418;border-radius:99px;padding:8px 14px;border:0;cursor:pointer;font-family:inherit}

.ph{--bg:#111215;--card:#1c1e23;--sep:rgba(255,255,255,.07);--hint:#9aa0ab;--link:#5ea8ff;--grn:#3ccf74;--red:#ff5a4f;--blue:#3e88f7;--ease:cubic-bezier(.2,.8,.2,1);
  position:relative;width:375px;height:780px;border-radius:48px;overflow:hidden;background:var(--bg);color:#fff;box-shadow:0 0 0 8px #000,0 0 0 9px #2b2e34,0 40px 80px -24px rgba(0,0,0,.9);user-select:none;-webkit-user-select:none}
.ph .in{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.ph .in::-webkit-scrollbar{display:none}
.ph *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.ph :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ph .tgbar{height:100px;padding:54px 14px 0;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.ph .tgbar .bk{font-size:22px;width:28px}
.ph .tgbar .ttl{display:flex;align-items:center;gap:8px;background:#1c1e23;border-radius:99px;padding:6px 12px 6px 6px}
.ph .tgbar .ttl .av{width:24px;height:24px;border-radius:50%;background:#2a8a45;display:grid;place-items:center;font-size:15px}
.ph .tgbar .mo{margin-left:auto;font-size:20px;letter-spacing:1px}
.ph .scr{min-height:0;padding:0 0 40px;background:none}

/* ---------- widget card ---------- */
.hc { position: relative; overflow: hidden; margin: 0 8px; border-radius: 26px; padding: 26px 22px 22px; text-align: center; z-index: 0;
  animation: rise .55s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.hc.blue { background: linear-gradient(160deg, #5fb4ff 0%, #2f86f0 55%, #1d63d6 100%); }
.hc.green { background: linear-gradient(160deg, #5fd38d 0%, #28a464 58%, #16804a 100%); }
.hc.indigo { background: linear-gradient(180deg, #26307a 0%, #3d4ea3 50%, #6177cc 100%); }
.hc.purple { background: linear-gradient(170deg, #3b1f78 0%, #6a3cc0 55%, #9a6ae6 100%); }
.hc.teal { background: linear-gradient(165deg, #0f5f66 0%, #178f8f 55%, #3fc6b4 100%); }
.hc.orange { background: linear-gradient(165deg, #7a3410 0%, #d0661f 55%, #f6a447 100%); }
.hc.red { background: linear-gradient(165deg, #6e1714 0%, #c8352c 55%, #f0685a 100%); }
.hc.slate { background: linear-gradient(170deg, #1f2a3d 0%, #354764 55%, #5c7397 100%); }
.hc.stars { background: linear-gradient(165deg, #6e3d00 0%, #d98a0b 52%, #ffc93d 100%); }
.hc.sbp { background: linear-gradient(160deg, #5fd38d 0%, #28a464 58%, #16804a 100%); }
.hc.cardpay { background: linear-gradient(160deg, #5fd38d 0%, #28a464 58%, #16804a 100%); }
.hc { transition: background .5s; }
.tgstar { margin: -10px auto; filter: drop-shadow(0 8px 18px rgba(120, 60, 0, .35)); }
.tgstar.fb { display: flex; align-items: center; justify-content: center; font-size: 56px; }
.hc.gold { background: linear-gradient(165deg, #6b4a06 0%, #c28d15 55%, #f1c94c 100%); }
.hc.compact { padding: 20px 22px; }
.hc.compact .ill { font-size: 64px; }
.ov { position: absolute; inset: 0; z-index: -2; opacity: 0; transition: opacity .7s ease; pointer-events: none;
  background: linear-gradient(160deg, #5fd38d 0%, #28a464 58%, #16804a 100%); }
.dn > .ov { opacity: 1; }
.go { animation: pp .9s ease-out; }
@keyframes pp { 30% { transform: scale(1.04); box-shadow: 0 0 40px 8px rgba(70, 220, 130, .55); } }
.shim::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, .3), transparent 65%);
  animation: sh 1.6s infinite; pointer-events: none; }
@keyframes sh { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.sp { position: absolute; z-index: -1; animation: tw 2.6s ease-in-out infinite; pointer-events: none; line-height: 0; }
@keyframes tw { 50% { opacity: .15; transform: scale(.55) rotate(20deg); } }
.rb { position: absolute; top: 18px; right: -38px; width: 140px; transform: rotate(45deg); background: rgba(255, 255, 255, .22); font-size: 12.5px;
  font-weight: 600; padding: 4px 0; letter-spacing: .02em; animation: rbin .5s .25s var(--ease) both; }
@keyframes rbin { from { opacity: 0; transform: rotate(45deg) translateY(-14px); } }
.ill { font-size: 88px; line-height: 1; margin-bottom: 12px; animation: pop .7s .08s var(--ease) both; }
.ill > * { display: block; margin: 0 auto; width: max-content; filter: drop-shadow(0 16px 26px rgba(0, 0, 0, .35)); animation: fl 3.4s 1s ease-in-out infinite; }
.ill img { display: block; }
@keyframes pop { 0% { opacity: 0; transform: scale(.5) rotate(-10deg); } 60% { transform: scale(1.08) rotate(3deg); } to { opacity: 1; transform: none; } }
@keyframes fl { 50% { transform: translateY(-6px); } }
/* frog.png is already round with clear corners; the shadow sits on the round wrapper. */
.frog { display: block; border-radius: 50%; object-fit: cover; }
.frogw { display: block; border-radius: 50%; box-shadow: 0 12px 26px rgba(0, 0, 0, .35); }
.ill > .frogw { filter: none; }
.H { font-size: 28px; font-weight: 800; line-height: 1.12; letter-spacing: -.4px; }
.N { font-size: 50px; font-weight: 800; letter-spacing: -1px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.P { font-size: 16px; opacity: .86; margin-top: 8px; line-height: 1.35; }
.K { font-size: 14px; font-weight: 600; opacity: .82; margin-bottom: 4px; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; opacity: .92; line-height: 1.55; margin-top: 12px; word-break: break-all; }
.acts { display: flex; gap: 12px; margin-top: 20px; align-items: center; }
.pill { flex: 1; min-width: 0; height: 52px; border-radius: 99px; background: #fff; color: #1d2340; display: flex; align-items: center; justify-content: center;
  gap: 10px; font-weight: 700; font-size: 17px; cursor: pointer; transition: transform .15s, background .3s, color .3s, opacity .2s; padding: 0 16px; }
.pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill:active, .rnd:active, .bbtn:active, .rw[data-go]:active, .rw[data-act]:active, .chp button:active { transform: scale(.97); }
.pill.dim, .pill:disabled { background: rgba(255, 255, 255, .3); color: rgba(255, 255, 255, .85); pointer-events: none; }
.rnd { width: 52px; height: 52px; border-radius: 99px; background: rgba(255, 255, 255, .2); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); display: flex;
  align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: transform .15s; font-size: 22px; color: #fff; }
.rnd.spin svg { animation: rot .7s var(--ease); }
@keyframes rot { to { transform: rotate(360deg); } }
.chip { display: inline-flex; margin-top: 12px; padding: 6px 12px; border-radius: 99px; background: rgba(255, 255, 255, .2); font-size: 13.5px; font-weight: 600; }
.chp { display: flex; gap: 6px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.chp button { height: 34px; padding: 0 12px; border-radius: 99px; background: rgba(255, 255, 255, .18); display: flex; align-items: center; font-weight: 600;
  font-size: 15px; transition: background .25s, color .25s, transform .15s; }
.chp .on { background: #fff; color: #1d2340; }
.inp { margin-top: 18px; height: 50px; border-radius: 14px; background: rgba(0, 0, 0, .2); display: flex; align-items: center; padding: 0 16px; transition: background .4s; }
.inp input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #fff; }
.inp input::placeholder { color: rgba(255, 255, 255, .55); letter-spacing: 0; font-weight: 600; }
.inp .sfx { font-size: 15px; opacity: .9; margin-left: 8px; white-space: nowrap; }
.inp.ok { background: rgba(40, 168, 100, .55); }
.inp.bad { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55); }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
.dots i { width: 22px; height: 4px; border-radius: 9px; background: rgba(255, 255, 255, .3); }
.dots i.on { background: #fff; }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 50px; margin: 16px 6px 0; }
.bars i { flex: 1; border-radius: 4px 4px 0 0; background: rgba(255, 255, 255, .3); transform-origin: bottom; animation: grow .7s var(--ease) both; min-height: 3px; }
.bars i.on { background: #fff; }
@keyframes grow { from { transform: scaleY(0); } }

/* ---------- below the card ---------- */
.st { font-size: 20px; font-weight: 600; color: #c4c9d3; margin: 22px 30px 12px; animation: up .5s .15s var(--ease) both; }
.cd { background: var(--card); border-radius: 26px; margin: 0 12px; padding: 4px 18px; animation: up .5s .2s var(--ease) both; }
.cd + .cd { margin-top: 12px; }
@keyframes up { from { opacity: 0; transform: translateY(12px); } }
.note { color: var(--hint); font-size: 13.5px; margin: 10px 30px 0; line-height: 1.38; animation: up .5s .25s var(--ease) both; }
.note.c { text-align: center; }
.tl { display: flex; gap: 16px; align-items: center; padding: 14px 0; position: relative; animation: up .5s var(--ease) both; animation-delay: calc(.28s + var(--i) * .12s); }
.tl + .tl::before { content: ""; position: absolute; left: 60px; right: 0; top: 0; height: 1px; background: var(--sep); }
.tl .n { width: 44px; height: 44px; border-radius: 99px; background: #121317; display: flex; align-items: center; justify-content: center; font-size: 20px;
  font-weight: 600; color: #c4c9d3; flex-shrink: 0; position: relative; transition: background .4s; }
.tl .n.ok { background: #28a464; color: #fff; }
.tl .n.run::before { content: ""; position: absolute; inset: -3px; border-radius: 99px; border: 2.5px solid rgba(94, 168, 255, .2); border-top-color: #5ea8ff;
  animation: rot .9s linear infinite; }
.tl:not(:last-child) .n::after { content: ""; position: absolute; left: 21px; top: 48px; height: 22px; border-left: 2px dashed #2d3038; }
.tl .tx { font-size: 17px; line-height: 1.3; }
.tl .sx { font-size: 14.5px; color: var(--hint); margin-top: 3px; }
.tl .sx b { color: var(--link); font-weight: 600; }
.rw { display: flex; align-items: center; gap: 12px; min-height: 54px; font-size: 16.5px; position: relative; transition: transform .15s; width: 100%; text-align: left; padding: 8px 0; }
.rw[data-go], .rw[data-act] { cursor: pointer; }
.rw + .rw::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--sep); }
.rw .v { margin-left: auto; color: var(--hint); display: flex; align-items: center; gap: 6px; font-size: 15.5px; flex-shrink: 0; }
.rw .e { font-size: 22px; width: 28px; text-align: center; flex-shrink: 0; }
.rw .ic { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; flex-shrink: 0; }
.cv { color: #5b606b; font-size: 22px; }
.rw .tt { display: flex; flex-direction: column; min-width: 0; }
.rw .tt > span { font-size: 13.5px; color: var(--hint); margin-top: 1px; }
.rw .tt b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.rw.red { color: var(--red); }
.rw.blue { color: var(--link); }
.pos { color: var(--grn); font-weight: 600; }
.neg { color: #fff; }
.dot { width: 8px; height: 8px; border-radius: 9px; background: var(--grn); display: inline-block; margin-right: 6px; animation: bl 2s infinite; }
.dot.off { background: #6c7380; animation: none; }
.dot.wait { background: #f0b43c; animation: none; }
@keyframes bl { 50% { box-shadow: 0 0 0 5px rgba(60, 207, 116, .18); } }
.rd { width: 22px; height: 22px; border-radius: 99px; border: 2px solid #3a3d45; display: flex; align-items: center; justify-content: center; transition: all .25s; flex-shrink: 0; }
.rd svg { opacity: 0; transform: scale(.3); transition: all .25s var(--ease); }
.rd.on { border-color: var(--blue); background: var(--blue); }
.rd.on svg { opacity: 1; transform: none; }
.tg { width: 50px; height: 30px; border-radius: 99px; background: var(--grn); position: relative; margin-left: auto; flex-shrink: 0; transition: background .25s; }
.tg::after { content: ""; position: absolute; left: 22px; top: 2px; width: 26px; height: 26px; border-radius: 99px; background: #fff; transition: left .25s var(--ease);
  box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
.tg.off { background: #39393d; }
.tg.off::after { left: 2px; }
.q { flex-direction: column; align-items: stretch; padding: 14px 0; }
.q .qh { display: flex; align-items: center; gap: 10px; }
.q .ans { max-height: 0; overflow: hidden; transition: max-height .35s var(--ease), margin .35s; color: #c4c9d3; font-size: 15px; line-height: 1.38; white-space: pre-line; }
.q.open .ans { max-height: 600px; margin-top: 6px; }
.q .cv { transition: transform .3s; }
.q.open .cv { transform: rotate(90deg); }
.q.open b { font-weight: 600; }
.q b { font-weight: 400; }

/* ---------- own amount ---------- */
@property --acc { syntax: "<color>"; inherits: true; initial-value: #3d8ff5; }
.am { transition: --acc .45s ease; --acc: #3d8ff5; --glow: 47, 134, 240; display: flex; flex-direction: column; min-height: calc(100vh - var(--st) - var(--sb) - 36px); position: relative; overflow: hidden; }
.am.gold { --acc: #f5a70f; --glow: 255, 190, 40; }
.am.green { --acc: #2fbf6f; --glow: 60, 200, 120; }
.am .cd { animation: none; }
.am-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-height: 200px; }
.am-glow { position: absolute; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--acc) 26%, transparent), transparent 65%); pointer-events: none; transition: transform .5s, opacity .5s; }
.am-stage.zero .am-glow { transform: scale(.75); opacity: .6; }
.am-w { position: relative; display: flex; align-items: center; transition: transform .45s cubic-bezier(.3, 1.25, .4, 1); }
.am.open .am-w { transform: scale(.86); }
.am-ico { position: relative; z-index: 3; width: 52px; height: 52px; margin-right: 6px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
.am-ico > * { display: block; }
.am-ico.in > * { animation: amIn .9s cubic-bezier(.3, 1.2, .4, 1) both; }
.am-ico.boom > * { animation: amBoom 1.1s cubic-bezier(.3, 1.3, .4, 1); filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .45)); }
@keyframes amIn { from { transform: translate(50px, -60px) scale(3.6); opacity: 0; } 30% { opacity: 1; } }
@keyframes amBoom { 22% { transform: scale(3.2) translateX(12px) rotate(-14deg); } 40% { transform: scale(3) translateX(12px) rotate(10deg); } 58% { transform: scale(3.1) translateX(12px) rotate(-5deg); } }
.am-num { position: relative; z-index: 1; display: flex; font-weight: 800; font-size: 72px; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
.am-num.l5 { font-size: 62px; } .am-num.l6 { font-size: 54px; }
.am-num span { display: inline-block; }
.am-num .add { transform-origin: 0 62%; animation: amAdd .2s linear both; }
@keyframes amAdd { 0% { transform: translateX(-.12em) scale(.32); opacity: .25; color: rgba(255,255,255,.5); }
  38% { transform: none; opacity: 1; color: rgba(255,255,255,.55); animation-timing-function: ease-in; } 70% { color: rgba(255,255,255,.6); } 100% { transform: none; color: #fff; } }
.am-num .out { position: absolute; top: 0; transform-origin: 0 62%; animation: amOut .18s ease-in forwards; }
@keyframes amOut { 40% { color: rgba(255,255,255,.55); } 100% { transform: translateX(-.1em) scale(.3); opacity: 0; color: rgba(255,255,255,.5); } }
.am-num.goo { filter: url(#amGoo); }
.am-num .melt { position: absolute; left: 0; top: 0; color: #fff; animation: amMelt .08s ease-in forwards; }
@keyframes amMelt { 0% { filter: blur(0); } 60% { transform: scale(.9, .96); filter: blur(5px); opacity: 1; } 100% { transform: scale(.8, .9); filter: blur(9px); opacity: 0; } }
.am-num .form { animation: amForm .12s cubic-bezier(.3, .7, .4, 1) both; }
@keyframes amForm { 0% { transform: scale(.82, .9); filter: blur(9px); opacity: 0; color: #fff; } 45% { filter: blur(5px); opacity: 1; } 75% { transform: scale(1.02); filter: blur(1.5px); } 100% { transform: none; filter: none; color: #fff; } }
.am-num .roll { filter: blur(1.6px); transform: translateY(var(--dy, 0)); }
.am-stage.zero .am-num { color: rgba(255, 255, 255, .3); }
.am-caret { z-index: 1; width: 3px; height: 52px; margin: 0 5px 0 6px; border-radius: 2px; background: var(--acc); opacity: 0; transition: opacity .2s; }
.am.open .am-caret { opacity: 1; animation: amBlink 1.05s steps(1) infinite .3s; }
@keyframes amBlink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
.am-unit { z-index: 1; color: var(--acc); font-weight: 800; font-size: 34px; margin-left: 4px; }
.am.open .am-unit { margin-left: 0; }
.am-unit.days { font-size: 26px; }
.am-sub { margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .75); font-size: 14px; font-weight: 600; transition: background .2s, color .2s, opacity .3s, transform .3s; }
.am-sub .sw { opacity: .6; font-size: 13px; }
.am-sub.bad { background: rgba(255, 80, 80, .14); color: #ff7a7a; }
.am-stage.zero .am-sub { opacity: 0; transform: translateY(-6px); pointer-events: none; }
.am-hint { position: absolute; bottom: calc(50% - 64px); color: var(--hint); font-size: 14px; transition: opacity .3s; }
.am-stage:not(.zero) .am-hint { opacity: 0; }
.am-w.shake { animation: amShake .4s; }
@keyframes amShake { 20%, 60% { transform: translateX(-9px) scale(.86); } 40%, 80% { transform: translateX(9px) scale(.86); } }
.am-ring { position: fixed; z-index: 30; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, transparent 42%, rgba(var(--glow), .2) 50%, rgba(var(--glow), .38) 60%, rgba(var(--glow), .14) 70%, transparent 72%);
  animation: amRing .6s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes amRing { 0% { transform: scale(.4); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(5.5); opacity: 0; } }
.am-bottom { padding: 0 12px; }
.am-quick { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
.am-quick button { padding: 8px 14px; border-radius: 99px; background: var(--card); font-weight: 600; font-size: 14px; transition: transform .1s; }
.am-quick button:active { transform: scale(.92); }
.am-pay { width: 100%; height: 54px; border-radius: 18px; background: var(--acc); color: #fff; font-weight: 700; font-size: 17px; transition: opacity .2s, transform .1s; }
.am-pay.off { opacity: .35; }
.am-pay:active { transform: scale(.98); }
.am-padw { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.3, 1.1, .4, 1); }
.am.open .am-padw { grid-template-rows: 1fr; }
.am-padw > div { overflow: hidden; }
.am-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-top: 12px; transform: translateY(40px); opacity: 0; transition: transform .45s cubic-bezier(.3, 1.2, .4, 1), opacity .3s; }
.am.open .am-pad { transform: none; opacity: 1; }
.am-pad button { height: 52px; border-radius: 14px; background: var(--card); font-size: 26px; font-weight: 500; transition: background .15s, transform .08s; }
.am-pad button:active { background: #2c2e35; transform: scale(.95); }
.am-pad button.fn { background: transparent; font-size: 22px; }

/* method switch on icon tap */
.am-ico { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.am-ico:active .am-ic:not(.go) { transform: scale(.88); transition: transform .1s; }
.am-ic { display: flex; align-items: center; justify-content: center; }
.am-ic.go { position: absolute; inset: 0; pointer-events: none; animation: amIcGo .34s cubic-bezier(.55, 0, .85, .45) forwards; }
@keyframes amIcGo { 0% { transform: none; } 30% { transform: translateY(4px) scale(1.06); } 100% { transform: translateY(-46px) rotate(-40deg) scale(.3); filter: blur(5px); opacity: 0; } }
.am-ic.come { animation: amIcCome .7s both; }
@keyframes amIcCome {
  0%, 18% { transform: translateY(44px) rotate(42deg) scale(.3); filter: blur(6px); opacity: 0; animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
  52% { transform: translateY(-6px) rotate(-8deg) scale(1.2); filter: none; opacity: 1; animation-timing-function: ease-in-out; }

  100% { transform: none; } }

@keyframes pin{from{transform:translateX(100%)}}

/* group gifts */
.ph .seg{display:flex;gap:4px;margin:0 12px 12px;padding:4px;border-radius:99px;background:var(--card)}
.ph .seg button{flex:1;height:36px;border-radius:99px;font-weight:600;font-size:15px;color:var(--hint)}

.bar{display:inline-block;width:46px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-right:4px}
.bar i{display:block;height:100%;background:#5ea8ff;border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.left{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:14px;opacity:.9}

.msg .who{color:#8fd3a8;font-weight:600;font-size:13px;margin-bottom:2px}
.msg .via{font-size:11.5px;color:var(--hint);margin-top:4px;text-align:right}
.msg.r{margin-left:auto;background:var(--blue);border-radius:18px 18px 6px 18px}
.msg.r .via{color:rgba(255,255,255,.7)}
.mbtn{max-width:84%;text-align:center;background:rgba(255,255,255,.1);border-radius:12px;padding:10px;font-weight:600;font-size:14.5px;margin:-2px 0 10px}

/* the gift scene */
.gift-ill{position:relative;height:159px;margin:-6px -22px 14px;cursor:pointer}

.g-glow{position:absolute;left:158px;top:56px;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,170,.85),rgba(255,180,90,.35) 35%,rgba(120,140,255,0) 68%);opacity:0;pointer-events:none}
.g-rays{position:absolute;left:158px;top:56px;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,236,200,.38) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 12%,transparent 62%);mask:radial-gradient(circle,#000 12%,transparent 62%)}

  background:linear-gradient(to top,rgba(255,248,230,.9),rgba(255,236,200,.35) 55%,rgba(255,236,200,0));filter:blur(2.5px);opacity:.3;animation:shf var(--d) ease-in-out var(--dl) infinite}

<body class="pg">
<div class="pg-wrap">
<h1 class="pg-h">Подарки в группу</h1>
<div class="pg-lead">Раздача: один даритель, одна ссылка в группе, N одинаковых подарков. Каждый забирает один раз, пока не кончатся; остаток даритель может вернуть. Экраны кликабельны: чипсы суммы и количества, «Своё», «Забрать подарок».</div>
<div class="pg-grid" id="grid"></div>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const STAR = (s, c = "#fff") => `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><path d="M10 0c.9 5.6 4.4 9.1 10 10-5.6.9-9.1 4.4-10 10-.9-5.6-4.4-9.1-10-10C5.6 9.1 9.1 5.6 10 0z" fill="${c}"/></svg>`;
const IC = {
  share: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M14 5l7 7-7 7v-4c-5 0-8.5 1.6-11 5 1-5 4-10 11-11z" fill="currentColor"/></svg>',
  copy: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="8" y="8" width="12" height="13" rx="3"/><path d="M16 8V6a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h1"/></svg>',
  heart: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z" fill="#fff"/></svg>',
  gift: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#c4c9d3"><path d="M4 11h7v10H6a2 2 0 0 1-2-2zm9 0h7v8a2 2 0 0 1-2 2h-5zM3 7h8v3H3zm10 0h8v3h-8zM12 7C9 2 5 4 7 7m5 0c3-5 7-3 5 0" stroke="#c4c9d3" stroke-width="1.6" fill-rule="evenodd"/></svg>',
};
const hap = () => { try { if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.(10); } catch (e) {} };
let uid = 0;

// ---------- the gift: a navy box in three-quarter view, orange satin ribbon, starry print ----------
function giftSVG() {
  const u = ++uid, ol = 'stroke="#141a36" stroke-width="3" stroke-linejoin="round"', rl = 'stroke="#7a3410" stroke-width="1.6" stroke-linejoin="round"';
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  const P = (...pts) => pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ");
  const band = (a, b, c, d, t0 = .42, t1 = .58) => P(lerp(a, b, t0), lerp(a, b, t1), lerp(d, c, t1), lerp(d, c, t0));
  // body
  const L = [[40, 100], [98, 120], [98, 186], [44, 166]], R = [[98, 120], [164, 98], [160, 166], [98, 186]];
  // lid: top face A B C D and its two side strips
  const A = [32, 92], B = [98, 113], C = [172, 89], D = [106, 70], Ad = [32, 106], Bd = [98, 128], Cd = [172, 103];
  const dots = (pts) => pts.map(([x, y, s]) => s > 2 ? `<path transform="translate(${x} ${y}) scale(${s / 20})" d="M10 0c.9 5.6 4.4 9.1 10 10-5.6.9-9.1 4.4-10 10-.9-5.6-4.4-9.1-10-10C5.6 9.1 9.1 5.6 10 0z" fill="#fff" opacity=".9"/>` : `<circle cx="${x}" cy="${y}" r="${s}" fill="#cfe0ff" opacity=".8"/>`).join("");
  return `<svg viewBox="0 0 200 200">
  <defs>
    <linearGradient id="fl${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b62a6"/><stop offset="1" stop-color="#2b3a6e"/></linearGradient>
    <linearGradient id="fr${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34477f"/><stop offset="1" stop-color="#1d2852"/></linearGradient>
    <linearGradient id="ft${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d86cc"/><stop offset="1" stop-color="#4a5f9f"/></linearGradient>
    <linearGradient id="rb${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc677"/><stop offset=".5" stop-color="#f6923a"/><stop offset="1" stop-color="#d3631c"/></linearGradient>
    <linearGradient id="rd${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e57a2a"/><stop offset="1" stop-color="#a94812"/></linearGradient>
    <linearGradient id="gl${u}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="cr${u}"><polygon points="${P(...R)}"/></clipPath>
  </defs>
  <g class="sway">
    <ellipse cx="100" cy="182" rx="58" ry="9" fill="#0b1030" opacity=".35"/>
    <polygon points="${P(...L)}" fill="url(#fl${u})" ${ol}/>
    <polygon points="${P(...R)}" fill="url(#fr${u})" ${ol}/>
    ${dots([[56, 130, 6], [74, 150, 1.6], [62, 158, 1.2], [84, 136, 1.4], [120, 128, 1.3], [138, 146, 7], [116, 160, 1.6], [150, 120, 1.2], [128, 170, 1.2]])}
    <polygon points="${band(L[0], L[1], L[2], L[3])}" fill="url(#rd${u})" ${rl}/>
    <polygon points="${band(R[0], R[1], R[2], R[3])}" fill="url(#rd${u})" ${rl}/>
    <g clip-path="url(#cr${u})"><rect class="glint" x="90" y="80" width="34" height="120" fill="url(#gl${u})" transform="skewX(-18)"/></g>
    <g class="lid">
      <polygon points="${P(A, B, Bd, Ad)}" fill="url(#fl${u})" ${ol}/>
      <polygon points="${P(B, C, Cd, Bd)}" fill="url(#fr${u})" ${ol}/>
      <polygon points="${P(A, B, C, D)}" fill="url(#ft${u})" ${ol}/>
      ${dots([[60, 88, 1.3], [128, 80, 1.4], [146, 92, 1.1], [80, 80, 5]])}
      <polygon points="${band(A, B, Bd, Ad)}" fill="url(#rd${u})" ${rl}/>
      <polygon points="${band(B, C, Cd, Bd)}" fill="url(#rd${u})" ${rl}/>
      <polygon points="${band(A, D, C, B)}" fill="url(#rb${u})" ${rl}/>
      <polygon points="${band(B, A, D, C)}" fill="url(#rb${u})" ${rl}/>
      <g class="bow" transform="translate(102 89) scale(1.32) translate(-102 -91)">
        <path d="M100 88C76 50 44 58 54 82c7 16 28 14 46 6z" fill="url(#rb${u})" ${rl}/>
        <path d="M100 88C90 72 70 66 64 76c6 6 20 10 36 12z" fill="#b5531a" opacity=".55"/>
        <path d="M104 88c22-40 56-34 48-8-6 17-28 16-48 8z" fill="url(#rb${u})" ${rl}/>
        <path d="M104 88c10-16 30-22 38-12-6 7-20 11-38 12z" fill="#b5531a" opacity=".55"/>
        <path d="M97 92l-18 30 9-3 3 10 14-34z" fill="url(#rd${u})" ${rl}/>
        <path d="M107 92l16 28-9-2-3 10-11-33z" fill="url(#rd${u})" ${rl}/>
        <ellipse cx="102" cy="89" rx="10" ry="9" fill="url(#rb${u})" ${rl}/>
        <path d="M60 70c6-8 16-10 24-6M120 62c8-6 18-6 24 0" stroke="#ffe0b0" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".9"/>
        <path d="M97 85c2-2 5-3 8-2" stroke="#ffe7c4" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g></svg>`;
}
function scene(n) {
  const stars = [[18, 34, 14, 0, "#9fb4ff"], [272, 20, 20, .8, "#9fb4ff"], [52, 92, 10, 1.4, "#cbd7ff"], [258, 102, 12, .4, "#cbd7ff"], [86, 8, 7, 1.9, "#fff"], [236, 66, 6, 1.1, "#fff"], [30, 130, 6, 2.2, "#fff"], [290, 136, 8, .2, "#9fb4ff"]]
    .map(([x, y, s, d, c]) => `<span class="tw d" style="left:${x}px;top:${y}px;animation-delay:${d}s">${STAR(s, c)}</span>`).join("");
  return `<div class="gift-ill"><div class="box"><div class="g-rays"></div><div class="g-glow"></div><div class="lot body"></div><div class="g-beam"><i class="wide"></i><i class="sh" style="--w:10px;--h:210px;--r:-22deg;--d:1.9s;--dl:0s"></i><i class="sh" style="--w:6px;--h:190px;--r:-13deg;--d:1.5s;--dl:0.4s"></i><i class="sh" style="--w:14px;--h:220px;--r:-5deg;--d:2.2s;--dl:0.9s"></i><i class="sh" style="--w:8px;--h:215px;--r:3deg;--d:1.7s;--dl:0.2s"></i><i class="sh" style="--w:12px;--h:205px;--r:11deg;--d:2.0s;--dl:0.7s"></i><i class="sh" style="--w:6px;--h:185px;--r:19deg;--d:1.6s;--dl:1.1s"></i><i class="sh" style="--w:9px;--h:200px;--r:26deg;--d:2.3s;--dl:0.5s"></i><i class="core"></i><i class="pool"></i></div><div class="lot lidl"></div><div class="g-flash"></div></div>${n ? `<div class="ill-n">${n}</div>` : ""}</div>`;
}

// ---------- cab.css building blocks ----------
const tl = (items) => `<div class="cd">${items.map((x, i) => `<div class="tl" style="--i:${i}"><div class="n ${x[3] || ""}">${x[0]}</div><div><div class="tx">${x[1]}</div>${x[2] ? `<div class="sx">${x[2]}</div>` : ""}</div></div>`).join("")}</div>`;
const faq = (qs) => `<div class="cd">${qs.map((q) => `<button type="button" class="rw"><span>${q}</span><span class="cv">›</span></button>`).join("")}</div>`;
const bar = `<div class="tgbar"><span class="bk">←</span><span class="ttl"><span class="av">🐸</span>Лягушка VPN</span><span class="mo">···</span></div>`;

const SCREENS = [
  { t: "1 · Раздача в группу", d: "Та же вкладка «Подарить». Второй ряд — сколько подарков. Сверху сразу видно «300 ₽ × 15» и сколько это всего. Попробуйте чипсы и «Своё».",
    html: () => `${bar}<div class="scr"><div class="seg"><button>Пригласить</button><button class="on">Подарить</button></div><section class="hc indigo">${scene()}
      <div class="K">Подарки в группу</div><div class="N amt">300 ₽ × 15</div><div class="P days">4 500 ₽ всего · каждому ≈ 50 дней</div>
      <div class="chp"><button data-v="180">180 ₽</button><button class="on" data-v="300">300 ₽</button><button data-v="540">540 ₽</button><button class="own" data-own>Своя</button></div>
      <div class="cntl">Сколько подарков</div><div class="chp cnt"><button data-n="1">1</button><button data-n="5">5</button><button class="on" data-n="15">15</button><button data-nown>Своё</button></div>
      <div class="acts"><button type="button" class="pill">${IC.share}<span>Подарить в группу</span></button><button type="button" class="rnd" aria-label="Скопировать ссылку">${IC.copy}</button></div></section>
      <div class="note">Баланс 5 120 ₽ · подарить можно до 4 800 ₽</div>
      <div class="st">Ваши подарки</div><div class="cd">
        <button class="rw"><span class="e">🎁</span><span class="tt"><b>300 ₽ × 15</b><span>забрали 8 из 15 · Сегодня</span></span><span class="v"><span class="bar"><i style="width:53%"></i></span><span class="cv">›</span></span></button>
        <button class="rw"><span class="e">✅</span><span class="tt"><b>180 ₽</b><span>Оля · 11 ноября</span></span></button></div></div>`,
    bind(ph) { ph._amt = 300; ph._cnt = 15; } },
  { t: "2 · Карточка в группе", d: "Что приходит в группу через «Поделиться». Одна кнопка на всех; под ней бот не спамит — счётчик «осталось» виден уже в кабинете.",

  el.innerHTML = `<div class="tgbar"><span class="bk" data-x>←</span><span class="ttl"><span class="av">🐸</span>Лягушка VPN</span><span class="mo">···</span></div>
  <div class="am" id="am"><div class="am-stage zero"><div class="am-glow"></div><div class="am-w"><div class="am-num"><span>0</span></div><div class="am-caret"></div><div class="am-unit days">подарков</div></div>
    <button type="button" class="am-sub"><span class="am-st"></span></button><div class="am-hint">Сколько подарков раздать?</div></div>
    <div class="am-bottom"><div class="am-quick">${[10, 25, 50].map((q) => `<button type="button" data-q="${q}">${q}</button>`).join("")}</div>
      <button type="button" class="am-pay off"><span>Введите количество</span></button>
      <div class="am-padw"><div><div class="am-pad">${["1", "2", "3", "4", "5", "6", "7", "8", "9", "c", "0", "b"].map((k) => `<button type="button" data-k="${k}"${k === "c" || k === "b" ? ' class="fn"' : ""}>${k === "b" ? "⌫" : k === "c" ? "C" : k}</button>`).join("")}</div></div></div></div></div>`;
  ph.appendChild(el);
  const paint = () => { const n = +v || 0, ok = n >= 2 && n <= 100, tot = n * ph._amt;
    $(".am-num", el).innerHTML = [...(v || "0")].map((c) => `<span>${c}</span>`).join("");
    $(".am-unit", el).textContent = pl(n, "подарок", "подарка", "подарков");
    $(".am-stage", el).classList.toggle("zero", !n); $(".am-sub", el).classList.toggle("bad", n > 0 && !ok);
    $(".am-st", el).textContent = !n ? "" : n < 2 ? "Минимум 2" : n > 100 ? "Максимум 100" : `по ${fmt(ph._amt)} ₽ · ${fmt(tot)} ₽ всего`;
    const p = $(".am-pay", el); p.classList.toggle("off", !ok); $("span", p).textContent = ok ? `Раздать ${n} ${pl(n, "подарок", "подарка", "подарков")}` : "Введите количество"; };
  const close = () => { el.classList.add("leave"); setTimeout(() => el.remove(), 380); };
  el.addEventListener("click", (e) => { const k = e.target.closest("[data-k]"), q = e.target.closest("[data-q]");
    if (e.target.closest("[data-x]")) return close();
    if (k) { const c = k.dataset.k; v = c === "b" ? v.slice(0, -1) : c === "c" ? "" : (v + c).replace(/^0/, "").slice(0, 3); paint(); }
    if (q) { v = q.dataset.q; paint(); }
    if (e.target.closest(".am-pay") && !$(".am-pay", el).classList.contains("off")) { ph._cnt = +v; paintGroup(ph); close(); } });
  paint(); setTimeout(() => $("#am", el).classList.add("open"), 380);
}
function mount(i) { const s = SCREENS[i], ph = document.getElementById("ph" + i); ph._a && ph._a.destroy(); ph.innerHTML = `<div class="in">${s.html()}</div>`;
  const mk = (el, f) => lottie.loadAnimation({ container: el, renderer: "svg", loop: true, autoplay: false, path: "tg/" + f });
  const A = [mk($(".body", ph), "wallet_gift_body.json"), mk($(".lidl", ph), "wallet_gift_lid.json")]; let ready = 0;
  A.forEach((x) => x.addEventListener("DOMLoaded", () => { if (++ready === 2) A.forEach((y) => y.goToAndPlay(0, true)); }));
  ph._a = { destroy: () => A.forEach((x) => x.destroy()), pause: () => A.forEach((x) => x.pause()) }; s.bind && s.bind(ph); }
$("#grid").innerHTML = SCREENS.map((s, i) => `<div class="pg-it"><div class="pg-t">${s.t}</div><div class="pg-d">${s.d}</div><div class="ph" id="ph${i}"></div><button class="pg-rp" data-i="${i}">↻ Заново</button></div>`).join("");
SCREENS.forEach((_, i) => mount(i));
document.addEventListener("click", (e) => { const b = e.target.closest(".pg-rp"); if (b) mount(+b.dataset.i); const k = e.target.closest(".cnt button"); if (k) { const ph = k.closest(".ph"); if (k.hasAttribute("data-nown")) { openCount(ph); return; } ph._cnt = +k.dataset.n; paintGroup(ph); return; }
  const c = e.target.closest(".chp button"); if (c) { c.parentNode.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === c));
  const ph = c.closest(".ph"); if (c.hasAttribute("data-own")) { openAmount(ph); return; } setGift(ph, +c.dataset.v, false); } });
</script>
